name: Agent repository export

on:
  push:
    branches:
      - fix/issue-16-own-builtin-registry
      - fix/issue-15-safe-named-arguments
      - fix/issue-13-visible-list-text

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
