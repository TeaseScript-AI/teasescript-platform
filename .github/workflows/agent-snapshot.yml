name: Issue 38 Dependencies

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: tar -czf issue-38-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: issue-38-node-modules
          path: issue-38-node-modules.tar.gz
          retention-days: 1
