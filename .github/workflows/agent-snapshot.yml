name: Apply Issue 38 Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply and verify patch
        run: |
          git apply --check .agent/issue-38.patch
          git apply .agent/issue-38.patch
          rm .agent/issue-38.patch
          rm tests/issue-38-reproduction.test.ts
          rm .github/workflows/agent-snapshot.yml
          npm ci
          npm run check
          npm run build
          node --test dist/tests/semantic-validation.test.js
          git diff --check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject builtin identifiers used as values"
          git push origin HEAD:${{ github.head_ref }}
