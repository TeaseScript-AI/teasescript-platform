name: Apply Agent 2 lexer fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Accept multiline nested template openings
        run: |
          python - <<'PY'
          from pathlib import Path

          lexer = Path("src/lexer.ts")
          source = lexer.read_text()
          boundary = '''    const previousKind = this.#tokens[index]?.kind;
              if (
                previousKind === TokenKind.InterpolationStart &&
                this.#isTemplateBoundaryAtLineEnd()
              ) {
                return false;
              }

              switch (previousKind) {'''
          replacement = '''    const previousKind = this.#tokens[index]?.kind;
              switch (previousKind) {'''
          helper = '''
            #isTemplateBoundaryAtLineEnd(): boolean {
              let distance = 1;
              while (isHorizontalWhitespace(this.#peek(distance))) distance += 1;
              const character = this.#peek(distance);
              return (
                character === "\\n" ||
                character === "\\0" ||
                (character === "\\r" && this.#peek(distance + 1) === "\\n")
              );
            }
          '''
          if boundary not in source or helper not in source:
              raise SystemExit("Expected nested-template boundary implementation was not found.")
          lexer.write_text(source.replace(boundary, replacement).replace(helper, ""))

          runtime = Path("docs/RUNTIME.md")
          text = runtime.read_text()
          old = "Unterminated nested content remains structured: `TSL004` reports an unterminated template and `TSL005` reports an unterminated interpolation. The established recovery boundary is preserved when a backtick immediately follows an interpolation start and only horizontal whitespace remains before a physical line end or end of source."
          new = "Unterminated nested content remains structured: `TSL004` reports an unterminated template and `TSL005` reports an unterminated interpolation. A backtick starts a nested template whenever the current interpolation position can begin an expression, including when horizontal whitespace or a physical line ending follows the nested opening backtick. A backtick in a position where an expression cannot start remains the outer-template recovery boundary."
          if old not in text:
              raise SystemExit("Expected stale runtime documentation was not found.")
          runtime.write_text(text.replace(old, new))
          PY
          git add src/lexer.ts docs/RUNTIME.md
          git commit -m "Accept multiline nested template openings"
      - name: Use prototype-safe lexer lookup tables
        run: |
          python - <<'PY'
          from pathlib import Path

          lexer = Path("src/lexer.ts")
          source = lexer.read_text()
          old = '''const keywordKinds: Readonly<Record<string, TokenKind>> = {
            speaker: TokenKind.KeywordSpeaker,
            say: TokenKind.KeywordSay,
            as: TokenKind.KeywordAs,
            exit: TokenKind.KeywordExit,
            let: TokenKind.KeywordLet,
            if: TokenKind.KeywordIf,
            else: TokenKind.KeywordElse,
            true: TokenKind.KeywordTrue,
            false: TokenKind.KeywordFalse,
            null: TokenKind.KeywordNull,
            not: TokenKind.KeywordNot,
            and: TokenKind.KeywordAnd,
            or: TokenKind.KeywordOr,
            set: TokenKind.KeywordSet,
            repeat: TokenKind.KeywordRepeat,
            for: TokenKind.KeywordFor,
            in: TokenKind.KeywordIn,
            while: TokenKind.KeywordWhile,
            break: TokenKind.KeywordBreak,
            continue: TokenKind.KeywordContinue,
            function: TokenKind.KeywordFunction,
            return: TokenKind.KeywordReturn,
          };'''
          new = '''const keywordKinds: ReadonlyMap<string, TokenKind> = new Map([
            ["speaker", TokenKind.KeywordSpeaker],
            ["say", TokenKind.KeywordSay],
            ["as", TokenKind.KeywordAs],
            ["exit", TokenKind.KeywordExit],
            ["let", TokenKind.KeywordLet],
            ["if", TokenKind.KeywordIf],
            ["else", TokenKind.KeywordElse],
            ["true", TokenKind.KeywordTrue],
            ["false", TokenKind.KeywordFalse],
            ["null", TokenKind.KeywordNull],
            ["not", TokenKind.KeywordNot],
            ["and", TokenKind.KeywordAnd],
            ["or", TokenKind.KeywordOr],
            ["set", TokenKind.KeywordSet],
            ["repeat", TokenKind.KeywordRepeat],
            ["for", TokenKind.KeywordFor],
            ["in", TokenKind.KeywordIn],
            ["while", TokenKind.KeywordWhile],
            ["break", TokenKind.KeywordBreak],
            ["continue", TokenKind.KeywordContinue],
            ["function", TokenKind.KeywordFunction],
            ["return", TokenKind.KeywordReturn],
          ]);'''
          if old not in source:
              raise SystemExit("Expected keyword lookup table was not found.")
          source = source.replace(old, new)
          source = source.replace(
              "const kind = keywordKinds[lexeme];",
              "const kind = keywordKinds.get(lexeme);",
          )
          lexer.write_text(source)
          PY
          git add src/lexer.ts
          git commit -m "Use prototype-safe lexer lookup tables"
      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/agent2-lexer-baseline.yml
          git add -u .github/workflows/agent2-lexer-baseline.yml
          git commit -m "Remove temporary lexer patch workflow"
          git push origin HEAD:refs/heads/${{ github.head_ref }}
