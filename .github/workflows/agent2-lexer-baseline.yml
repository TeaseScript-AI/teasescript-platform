name: Agent 2 lexer baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Package checkout snapshot
        run: tar -czf /tmp/lexer-checkout-snapshot.tar.gz --exclude=node_modules --exclude=dist --exclude=lexer-baseline.txt .
      - name: Upload checkout snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lexer-checkout-snapshot
          path: /tmp/lexer-checkout-snapshot.tar.gz
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Build
        run: npm run build --silent
      - name: Capture failing baseline
        shell: bash
        run: |
          set +e
          {
            node --version
            npm --version
            node --test dist/tests/lexer-boundaries.test.js
          } > lexer-baseline.txt 2>&1
          status=$?
          set -e
          printf '\nexit_code=%s\n' "$status" >> lexer-baseline.txt
          test "$status" -ne 0
      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexer-baseline-evidence
          path: lexer-baseline.txt
