name: Agent 2 lexer verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Capture verification
        shell: bash
        run: |
          set +e
          {
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            npm run check
            echo "full_status=$?"
            npm run build
            echo "build_status=$?"
            node --test dist/tests/lexer-boundaries.test.js
            echo "focused_status=$?"
            git diff --check origin/main...HEAD
            echo "diff_check_status=$?"
            echo "worktree_status_begin"
            git status --short
            echo "worktree_status_end"
          } > lexer-verification.txt 2>&1
          set -e
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: lexer-verification-output
          path: lexer-verification.txt
