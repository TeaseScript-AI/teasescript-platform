name: Agent 4 apply instructions patch

on:
  push:
    branches:
      - fix/issue-12-validate-legacy-execute

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-12-validate-legacy-execute
          fetch-depth: 0
      - name: Apply defensive lowering patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/instructions.ts")
          source = path.read_text()

          interface = '''export interface PlanValidationResult {
            readonly valid: boolean;
            readonly errors: readonly PlanValidationError[];
          }

          export function compileProgram'''
          replacement = '''export interface PlanValidationResult {
            readonly valid: boolean;
            readonly errors: readonly PlanValidationError[];
          }

          /** Controlled compiler-boundary failure for semantically invalid AST input. */
          export class InstructionCompilationError extends Error {
            readonly span: SourceSpan;

            public constructor(
              readonly code: "TSC003",
              message: string,
              span: SourceSpan,
            ) {
              super(message);
              this.name = "InstructionCompilationError";
              this.span = copySpan(span);
            }
          }

          export function compileProgram'''

          parameter = '''      const parameterName =
                argument.kind === "namedArgument"
                  ? argument.name.name
                  : registered.declaration.parameters[index]!.name.name;
              prepared.push({'''
          parameter_replacement = '''      let parameterName: string;
              if (argument.kind === "namedArgument") {
                parameterName = argument.name.name;
              } else {
                const parameter = registered.declaration.parameters[index];
                if (parameter === undefined) {
                  throw new InstructionCompilationError(
                    "TSC003",
                    `Function '${name}' has no parameter for positional argument ${index + 1}.`,
                    argument.span,
                  );
                }
                parameterName = parameter.name.name;
              }
              prepared.push({'''

          for old, new, label in [
              (interface, replacement, "error class insertion"),
              (parameter, parameter_replacement, "parameter guard"),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label} target, found {source.count(old)}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/agent4-apply-instructions-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/instructions.ts
          git diff --cached --check
          git commit -m "Harden function call lowering"
          git push origin HEAD:fix/issue-12-validate-legacy-execute
