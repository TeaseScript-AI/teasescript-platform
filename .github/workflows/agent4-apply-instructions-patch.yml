name: Agent 4 apply instructions patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/issue-12-validate-legacy-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-12-validate-legacy-execute
          fetch-depth: 0
      - name: Apply defensive lowering patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/instructions.ts")
          source = path.read_text()

          compile_anchor = "\nexport function compileProgram(program: Program): InstructionPlan {"
          if source.count(compile_anchor) != 1:
              raise SystemExit(
                  f"Expected one compileProgram anchor, found {source.count(compile_anchor)}"
              )
          error_class = '''

          /** Controlled compiler-boundary failure for semantically invalid AST input. */
          export class InstructionCompilationError extends Error {
            readonly span: SourceSpan;

            public constructor(
              readonly code: "TSC003",
              message: string,
              span: SourceSpan,
            ) {
              super(message);
              this.name = "InstructionCompilationError";
              this.span = copySpan(span);
            }
          }
          '''
          source = source.replace(compile_anchor, error_class + compile_anchor, 1)

          start_anchor = "      const parameterName =\n"
          end_anchor = "      prepared.push({\n"
          start = source.find(start_anchor)
          if start < 0:
              raise SystemExit("Parameter-name lowering anchor not found")
          end = source.find(end_anchor, start)
          if end < 0:
              raise SystemExit("Prepared-argument anchor not found")
          guard = '''      let parameterName: string;
                if (argument.kind === "namedArgument") {
                  parameterName = argument.name.name;
                } else {
                  const parameter = registered.declaration.parameters[index];
                  if (parameter === undefined) {
                    throw new InstructionCompilationError(
                      "TSC003",
                      `Function '${name}' has no parameter for positional argument ${index + 1}.`,
                      argument.span,
                    );
                  }
                  parameterName = parameter.name.name;
                }
          '''
          source = source[:start] + guard + source[end:]
          path.write_text(source)
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/agent4-apply-instructions-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/instructions.ts
          git diff --cached --check
          git commit -m "Harden function call lowering"
          git push origin HEAD:fix/issue-12-validate-legacy-execute
