name: Agent 4 apply halted snapshot fix

on:
  push:
    branches: [fix/issues-40-41-runtime-snapshot-invariants]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-40-41-runtime-snapshot-invariants
          fetch-depth: 0
      - name: Apply issue 40 patch
        env:
          PATCH_B64: : InstructionPlan;
+  snapshot: RuntimeSnapshot;
+} {
+  return structuredClone(checkpoint);
+}
+
+function assertCheckpointRejected(value: unknown, code: string): void {
+  assert.throws(() => restoreCheckpoint(value), (error: unknown) => {
+    return error instanceof CheckpointError && error.info.code === code;
+  });
+}
