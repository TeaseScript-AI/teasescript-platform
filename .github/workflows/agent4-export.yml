name: Agent 4 repository export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create repository archive
        run: tar --exclude=.git -czf /tmp/teasescript-platform.tar.gz .
      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: agent4-repository-export
          path: /tmp/teasescript-platform.tar.gz
          if-no-files-found: error
          retention-days: 1
