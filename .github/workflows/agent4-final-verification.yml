name: Agent 4 final verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'fix/issue-12-validate-legacy-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-12-validate-legacy-execute
          fetch-depth: 0
      - name: Set up repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify repository Node version
        run: test "$(node --version)" = "v$(cat .nvmrc)"
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npm test -- --test-name-pattern="direct AST|lowering reports|semantic boundary"
      - name: Run complete checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check complete diff
        run: git diff --check origin/main...HEAD
