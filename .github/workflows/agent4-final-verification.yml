name: Agent 4 final verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'fix/issue-12-validate-legacy-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-12-validate-legacy-execute
          fetch-depth: 0
      - name: Use repository Node version
        run: |
          source "$NVM_DIR/nvm.sh"
          nvm use
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npm test -- --test-name-pattern="direct AST|lowering reports|semantic boundary"
      - name: Run complete checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check complete diff
        run: git diff --check origin/main...HEAD
