name: Agent 4 focused repository hygiene verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused compatibility and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          rm -rf dist
          npm run build
          node --test \
            dist/tests/interpreter.test.js \
            dist/tests/runtime-semantics.test.js \
            dist/tests/runtime-engine-hardening.test.js \
            dist/tests/runtime-checkpoint.test.js \
            dist/tests/visible-list-text-runtime.test.js \
            dist/tests/playground-example.test.js \
            dist/tests/playground-server.test.js \
            2>&1 | tee "$RUNNER_TEMP/evidence/focused-tests.log"
          git diff --check origin/main...HEAD
          git status --short | tee "$RUNNER_TEMP/evidence/git-status.txt"
          test ! -s "$RUNNER_TEMP/evidence/git-status.txt"
      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent4-focused-repository-hygiene-verification
          path: ${{ runner.temp }}/evidence
