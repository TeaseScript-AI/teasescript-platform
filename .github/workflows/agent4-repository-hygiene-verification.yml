name: Agent 4 repository hygiene verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          node --version | tee "$RUNNER_TEMP/evidence/node-version.txt"
          npm --version | tee "$RUNNER_TEMP/evidence/npm-version.txt"
      - name: Install dependencies
        run: npm ci
      - name: Verify canonical clean build and tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run check 2>&1 | tee "$RUNNER_TEMP/evidence/check.log"
          test "$(grep -c '^> tsc$' "$RUNNER_TEMP/evidence/check.log")" -eq 1
          test -f dist/src/index.js
          test -f dist/playground/browser.js
          test -f dist/playground/server.js
          test -f dist/tests/interpreter.test.js
          test -f dist/tests/runtime-checkpoint.test.js
          test ! -e dist/src/runtime/environment.js
          test ! -e dist/src/runtime/collections.js
          test ! -e dist/src/runtime/display.js
          test ! -e dist/src/runtime/value-guards.js
          find dist -type f | sort > "$RUNNER_TEMP/evidence/dist-tree.txt"
      - name: Verify retained focused commands
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/evidence/typecheck.log"
      - name: Verify import graph and symbols
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          search_roots=(
            src tests playground docs tools examples
            README.md README-FIRST.md CURRENT-DESIGN.md PHASE-STATUS.md AGENTS.md
            package.json tsconfig.json .github/workflows/ci.yml
          )
          set +e
          rg 'runtime/(environment|collections|display|value-guards)' "${search_roots[@]}" \
            > "$RUNNER_TEMP/evidence/module-search.txt"
          module_status=$?
          set -e
          cat "$RUNNER_TEMP/evidence/module-search.txt"
          test "$module_status" -eq 1
          set +e
          rg 'Environment|callCollectionMethod|getCollectionProperty|randomItem|assertListIndex|toVisibleText|resolveOutputSpeaker|isRuntime(List|Set|Object|Speaker)' \
            src tests playground > "$RUNNER_TEMP/evidence/symbol-search.txt"
          symbol_status=$?
          set -e
          cat "$RUNNER_TEMP/evidence/symbol-search.txt"
          test "$symbol_status" -eq 0 -o "$symbol_status" -eq 1
      - name: Verify diff and worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          git status --short | tee "$RUNNER_TEMP/evidence/git-status.txt"
          test ! -s "$RUNNER_TEMP/evidence/git-status.txt"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-repository-hygiene-verification
          path: ${{ runner.temp }}/evidence
