name: Agent 4 merge current main

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-40-41-runtime-snapshot-invariants
          fetch-depth: 0
      - name: Merge current main normally
        run: |
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main
          git push origin HEAD:fix/issues-40-41-runtime-snapshot-invariants
