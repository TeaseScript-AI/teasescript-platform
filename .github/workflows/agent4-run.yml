name: Agent 4 apply issue 40

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-40-41-runtime-snapshot-invariants
          fetch-depth: 0
      - name: Reconstruct and apply patch
        env:
          PATCH_4: 
        run: |
          python - <<'PY'
          import base64, os, pathlib
          lines = pathlib.Path('.github/workflows/agent4-export.yml').read_text().splitlines()
          parts = {}
          for line in lines:
              stripped = line.strip()
              for key in ('PATCH_1', 'PATCH_2', 'PATCH_3', 'PATCH_5'):
                  prefix = f'{key}: '
                  if stripped.startswith(prefix):
                      parts[key] = stripped[len(prefix):]
          encoded = parts['PATCH_1'] + parts['PATCH_2'] + parts['PATCH_3'] + os.environ['PATCH_4'] + parts['PATCH_5']
          pathlib.Path('/tmp/issue40.patch').write_bytes(base64.b64decode(encoded))
          PY
          git apply --check /tmp/issue40.patch
          git apply /tmp/issue40.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RUNTIME.md src/runtime/engine.ts src/runtime/state.ts tests/runtime-snapshot-invariants.test.ts
          git commit -m 'Reject impossible halted snapshots'
          git push origin HEAD:fix/issues-40-41-runtime-snapshot-invariants
