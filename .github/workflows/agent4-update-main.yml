name: Agent 4 update branch from main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'fix/issue-12-validate-legacy-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-12-validate-legacy-execute
          fetch-depth: 0
      - name: Merge latest main and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/agent4-update-main.yml
          git commit -m "Merge latest main into issue 12 branch"
      - name: Set up repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify repository Node version
        run: test "$(node --version)" = "v$(cat .nvmrc)"
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npm test -- --test-name-pattern="direct AST|lowering reports|semantic boundary"
      - name: Run complete checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check complete diff
        run: git diff --check origin/main...HEAD
      - name: Push integrated branch
        run: git push origin HEAD:fix/issue-12-validate-legacy-execute
