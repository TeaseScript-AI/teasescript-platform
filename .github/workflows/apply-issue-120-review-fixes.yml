name: Apply issue 120 consolidated review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-120-property-harness' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-120-property-harness
          fetch-depth: 0

      - name: Set up repository Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify and apply tested payload
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor da84f7bce8c41e00933a32dc0557169e089836fa HEAD
          cat .tmp/issue120-payload/part-* > /tmp/issue120-final-files.tar.gz.b64
          base64 --decode /tmp/issue120-final-files.tar.gz.b64 > /tmp/issue120-final-files.tar.gz
          echo '57d50540cdcbcc8265600157258a244716b9efd4da6a71de0366d33e15869e2c  /tmp/issue120-final-files.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/issue120-final-files.tar.gz
          rm -rf .tmp/issue120-payload
          rm -f .github/workflows/apply-issue-120-review-fixes.yml

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm -rf dist
          npm run check
          npm run build
          git diff --check

      - name: Commit consolidated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/TESTING.md \
            package.json \
            tests/property.test.ts \
            tests/property/fixtures.ts \
            tests/property/invariants.ts \
            tests/property/mutations.ts \
            tests/property/replay.ts \
            .tmp/issue120-payload \
            .github/workflows/apply-issue-120-review-fixes.yml
          git diff --cached --check
          git commit -m 'Address remaining property harness review findings'
          git push origin HEAD:agent/issue-120-property-harness
