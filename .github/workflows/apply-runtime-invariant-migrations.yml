name: Apply runtime invariant test migrations

on:
  push:
    branches: [test/runtime-invariant-harness]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: test/runtime-invariant-harness
          fetch-depth: 0
      - name: Migrate duplicated test helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          functions_path = Path("tests/functions-checkpoint.test.ts")
          functions = functions_path.read_text()
          functions_anchor = '''import {
            createFreshRuntimeSnapshot,
            type RuntimeSnapshot,
          } from "../src/runtime/state.js";
          '''
          functions_import = functions_anchor + '''import { assertRuntimeResumeEquivalent } from "./helpers/runtime-equivalence.js";
          '''
          if functions_anchor not in functions:
              raise SystemExit("functions-checkpoint import anchor not found")
          functions = functions.replace(functions_anchor, functions_import, 1)
          functions = re.sub(
              r"const (\w+) = assertEveryInstructionResume\(",
              r"const { boundaries: \1 } = assertRuntimeResumeEquivalent(",
              functions,
          )
          helper_start = functions.index("function assertEveryInstructionResume(")
          helper_end = functions.index("function recursiveSnapshot(", helper_start)
          functions = functions[:helper_start] + functions[helper_end:]
          if "assertEveryInstructionResume" in functions:
              raise SystemExit("file-local instruction resume helper still referenced")
          functions_path.write_text(functions)

          runtime_path = Path("tests/runtime-checkpoint.test.ts")
          runtime = runtime_path.read_text()
          runtime_anchor = '''import {
            createFreshRuntimeSnapshot,
            validateRuntimeSnapshot,
            type RuntimeSnapshot,
          } from "../src/runtime/state.js";
          '''
          runtime_import = runtime_anchor + '''import { assertRuntimeResumeEquivalent } from "./helpers/runtime-equivalence.js";
          '''
          if runtime_anchor not in runtime:
              raise SystemExit("runtime-checkpoint import anchor not found")
          runtime = runtime.replace(runtime_anchor, runtime_import, 1)
          runtime_start = runtime.index(
              'test("uninterrupted and checkpoint-resumed execution are identical", () => {'
          )
          runtime_end = runtime.index(
              'test("preserves nested deep-copy independence and ordered sets after restore",',
              runtime_start,
          )
          runtime_replacement = '''test("uninterrupted and checkpoint-resumed execution are identical", () => {
            const { finalSnapshot } = assertRuntimeResumeEquivalent([
              "speaker vera { title: \"Mistress\" }",
              "speaker vera",
              'let values = set["first", "second", "third"]',
              "let chosen = values.random",
              'say `Choice: ${chosen}`',
              'values.add("fourth")',
              'say `Again: ${values.random}`',
              "exit",
            ].join("\\n"), {
              scenarioName: "general runtime checkpoint equivalence",
              seed: 12345,
            });

            assert.equal(finalSnapshot.status, "halted");
          });

          '''
          runtime = runtime[:runtime_start] + runtime_replacement + runtime[runtime_end:]
          runtime_path.write_text(runtime)

          control_path = Path("tests/control-flow-runtime.test.ts")
          control = control_path.read_text()
          control_anchor = 'import { createFreshRuntimeSnapshot } from "../src/runtime/state.js";\n'
          control_import = control_anchor + 'import { assertRuntimeResumeEquivalent } from "./helpers/runtime-equivalence.js";\n'
          if control_anchor not in control:
              raise SystemExit("control-flow import anchor not found")
          control = control.replace(control_anchor, control_import, 1)
          old_call = "    assertResumeMatches(source);"
          new_call = '''    const { boundaries } = assertRuntimeResumeEquivalent(source, {
              scenarioName: `loop checkpoint corpus: ${source.split("\\n")[0]}`,
              seed: 9,
            });
            assert.ok(boundaries.some((snapshot) => snapshot.loopFrames.length > 0));'''
          if old_call not in control:
              raise SystemExit("control-flow helper call not found")
          control = control.replace(old_call, new_call, 1)
          control_start = control.index("function assertResumeMatches(")
          control_end = control.index("function runSource(", control_start)
          control = control[:control_start] + control[control_end:]
          if "assertResumeMatches" in control:
              raise SystemExit("file-local control-flow resume helper still referenced")
          control_path.write_text(control)
          PY
      - name: Commit migrated tests
        run: |
          git rm .github/workflows/apply-runtime-invariant-migrations.yml
          git add tests/functions-checkpoint.test.ts tests/runtime-checkpoint.test.ts tests/control-flow-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate runtime equivalence tests"
          git push origin HEAD:test/runtime-invariant-harness
