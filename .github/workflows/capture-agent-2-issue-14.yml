name: Capture Agent 2 issue 14 failure

on:
  push:
    branches: [fix/issue-9-finite-numeric-literals]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-9-finite-numeric-literals
          fetch-depth: 0
      - name: Capture focused test output
        run: |
          npm ci
          npm run check > /tmp/issue14-ci.log 2>&1 || true
          mkdir -p tools/tmp
          tail -120 /tmp/issue14-ci.log > tools/tmp/issue-14-ci-output.txt
          git rm .github/workflows/capture-agent-2-issue-14.yml
          git add tools/tmp/issue-14-ci-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture nested template test output"
          git push origin HEAD:fix/issue-9-finite-numeric-literals
