name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running check. A push to main gets its own group, so every main commit's
# check finishes (a pending run in a shared group would be cancelled by the next one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check runs as two jobs side by side (#1638): each installs and builds, then runs one half of the compiled tests
  # (`--shard=i/2`, shared out by measured seconds, `tools/test-shards.mjs`); check-2 also runs the checks before the
  # tests (`check:pretest`), once. Together they run what `npm run check` runs; `check`, the required check, passes only
  # where both passed.
  check-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run tests, shard 1 of 2
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BUILD_SOURCEMAPS: "0"
          TEST_FILE_SECONDS: ${{ runner.temp }}/test-file-seconds.json
        run: npm test -- --shard=1/2
      # The runtime oracle (docs/TESTING.md "Runtime pipeline oracle"): a pinned commit's own install and build, kept
      # between runs by its commit and lockfile, then compared with this build. It is outside the shards, so it runs
      # here alone, always.
      - name: Name the runtime oracle's pin
        id: oracle
        run: echo "key=runtime-oracle-$(node -p "const m = require('./tools/runtime-oracle/manifest.json'); m.commit + '-' + m.lockfile.sha256")" >> "$GITHUB_OUTPUT"
      - name: Restore the runtime oracle's root
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime-oracle
          key: ${{ steps.oracle.outputs.key }}
      - name: Compare with the runtime oracle
        env:
          RUNTIME_ORACLE_HOME: ${{ runner.temp }}/runtime-oracle
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm run oracle:test
      # each test file's seconds, which `tools/measure-test-files.mjs --from-ci` makes the shards' weights from
      - name: Keep each test file's seconds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-file-seconds-${{ github.run_attempt }}-1
          path: ${{ runner.temp }}/test-file-seconds.json
          if-no-files-found: error
          retention-days: 7
  check-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate local-agent tooling
        run: bash tools/local-agent/check-local-agent.sh
      - name: Upload local-agent failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-agent-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teasescript-local-agent-logs
          if-no-files-found: ignore
          retention-days: 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source before the tests
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm run check:pretest
      - name: Build and run tests, shard 2 of 2
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BUILD_SOURCEMAPS: "0"
          TEST_FILE_SECONDS: ${{ runner.temp }}/test-file-seconds.json
        run: npm test -- --shard=2/2
      # each test file's seconds, which `tools/measure-test-files.mjs --from-ci` makes the shards' weights from
      - name: Keep each test file's seconds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-file-seconds-${{ github.run_attempt }}-2
          path: ${{ runner.temp }}/test-file-seconds.json
          if-no-files-found: error
          retention-days: 7
  check:
    needs: [check-1, check-2]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both test jobs
        env:
          RESULTS: ${{ needs.check-1.result }} ${{ needs.check-2.result }}
        run: |
          if [ "$RESULTS" != "success success" ]; then
            echo "check-1 and check-2: $RESULTS"
            exit 1
          fi
