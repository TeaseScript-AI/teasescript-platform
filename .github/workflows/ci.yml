name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run of a branch's tip, such as the three runs on one head that `tools/measure-test-files.mjs --from-ci`
  # needs (a re-run replaces a run's artifacts): `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running check. A push to main gets its own group, so every main commit's
# check finishes (a pending run in a shared group would be cancelled by the next one), and so does each manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check runs as three jobs side by side (#1638, #1978): each installs and builds, then runs one third of the
  # compiled tests (`--shard=i/3`, shared out by measured seconds, `tools/test-shards.mjs`); check-3 also runs the
  # checks before the tests (`check:pretest`), once, and check-1 the runtime oracle comparison after them; the sharing
  # counts both. Together they run what `npm run check` runs; `check`, the required check, passes only where all three
  # passed. `tools/measure-test-files.mjs --from-ci` finds the test jobs by their step named "Build and run tests…" and
  # the two fixed steps by "Check source before the tests" and "Compare with the runtime oracle": keep those names.
  check-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
          # the history without file contents, for the regression cases' base (below)
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run tests, shard 1 of 3
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BUILD_SOURCEMAPS: "0"
          TEST_FILE_SECONDS: ${{ runner.temp }}/test-file-seconds.json
        run: npm test -- --shard=1/3
      # How the regression cases the pull request declares (`tests/helpers/regression-case.ts`) end at its base, reported,
      # not enforced (`tools/repository-checks/regression-cases.mjs`, docs/TESTING.md "Regression-test rule"): the step
      # never fails the job. It reuses the build above, and ends at once when no changed test file declares a case. The
      # base is the merge's first parent.
      - name: Regression cases at the base (reported)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node tools/repository-checks/regression-cases.mjs --base "$(git rev-parse HEAD^1)" --pr "$PR"
      # The runtime oracle (docs/TESTING.md "Runtime pipeline oracle"): a pinned commit's own install and build, kept
      # between runs by its commit and lockfile, then compared with this build. It is outside the shards, so it runs
      # here alone, always.
      - name: Name the runtime oracle's pin
        id: oracle
        run: echo "key=runtime-oracle-$(node -p "const m = require('./tools/runtime-oracle/manifest.json'); m.commit + '-' + m.lockfile.sha256")" >> "$GITHUB_OUTPUT"
      - name: Restore the runtime oracle's root
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime-oracle
          key: ${{ steps.oracle.outputs.key }}
      - name: Compare with the runtime oracle
        env:
          RUNTIME_ORACLE_HOME: ${{ runner.temp }}/runtime-oracle
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm run oracle:test
      # each test file's seconds, which `tools/measure-test-files.mjs --from-ci` makes the shards' weights from
      - name: Keep each test file's seconds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-file-seconds-${{ github.run_attempt }}-1
          path: ${{ runner.temp }}/test-file-seconds.json
          if-no-files-found: error
          retention-days: 7
  check-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run tests, shard 2 of 3
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BUILD_SOURCEMAPS: "0"
          TEST_FILE_SECONDS: ${{ runner.temp }}/test-file-seconds.json
        run: npm test -- --shard=2/3
      # each test file's seconds, which `tools/measure-test-files.mjs --from-ci` makes the shards' weights from
      - name: Keep each test file's seconds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-file-seconds-${{ github.run_attempt }}-2
          path: ${{ runner.temp }}/test-file-seconds.json
          if-no-files-found: error
          retention-days: 7
  check-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
          # the merge's first parent too, the base the structure signals are read against (below)
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate local-agent tooling
        run: bash tools/local-agent/check-local-agent.sh
      - name: Upload local-agent failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-agent-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teasescript-local-agent-logs
          if-no-files-found: ignore
          retention-days: 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source before the tests
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm run check:pretest
      # The structure signals the change adds to, against the merge's first parent, without Git's moved lines
      # (`tools/structure-report.mjs`, IMPLEMENTATION-AND-REVIEW.md "Code structure"): the report in the log, and the
      # files over 1000 lines or gaining over 300 in the job summary, one row each, for the plan, the review and the
      # merge check to answer; never failing. It runs in the job that runs `check:pretest`, after it.
      - name: Structure signals (advisory)
        continue-on-error: true
        run: node tools/structure-report.mjs --diff HEAD^1 --moved --summary "$GITHUB_STEP_SUMMARY"
      # The size of what the start route sends an implementing agent to read (`tools/reading-route-size.mjs`), with a
      # pull request's difference from the merge's first parent: reported only, never failing.
      - name: Reading route size (reported)
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: node tools/reading-route-size.mjs ${BASE:+--base "$BASE"}
      - name: Build and run tests, shard 3 of 3
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          BUILD_SOURCEMAPS: "0"
          TEST_FILE_SECONDS: ${{ runner.temp }}/test-file-seconds.json
        run: npm test -- --shard=3/3
      # each test file's seconds, which `tools/measure-test-files.mjs --from-ci` makes the shards' weights from
      - name: Keep each test file's seconds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-file-seconds-${{ github.run_attempt }}-3
          path: ${{ runner.temp }}/test-file-seconds.json
          if-no-files-found: error
          retention-days: 7
  check:
    needs: [check-1, check-2, check-3]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all three test jobs
        env:
          RESULTS: ${{ needs.check-1.result }} ${{ needs.check-2.result }} ${{ needs.check-3.result }}
        run: |
          if [ "$RESULTS" != "success success success" ]; then
            echo "check-1, check-2 and check-3: $RESULTS"
            exit 1
          fi
