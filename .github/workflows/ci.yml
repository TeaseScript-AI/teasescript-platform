name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/issue-39-control-flow-regions
          fetch-depth: 0
      - name: Apply issue 39 correction
        run: |
          python3 tools/issue39-fix.py
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate work-package tooling
        run: |
          bash -n tools/work-packages/integrate.sh
          jq empty tools/work-packages/PACKAGE.schema.json
          jq empty tools/work-packages/templates/PACKAGE.example.json
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Build
        run: npm run build
      - name: Commit and push issue 39 correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git add src/instructions.ts
          git commit -m "Validate specialized targets against execution regions"
          git push origin HEAD:fix/issue-39-control-flow-regions
