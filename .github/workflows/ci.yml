name: CI

on:
  push:
    branches:
      - fix/issue-15-safe-named-arguments
  pull_request:

permissions: {}

jobs:
  apply-agent-fix:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply named argument fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/runtime/engine.ts")
          source = path.read_text()
          old = "    const named: Record<string, SerializableRuntimeValue> = {};"
          new = "    const named: Record<string, SerializableRuntimeValue> = Object.create(null);"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one named argument collector.")
          path.write_text(source.replace(old, new))
          PY
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                - name: Validate work-package tooling
                  run: |
                    bash -n tools/work-packages/integrate.sh
                    jq empty tools/work-packages/PACKAGE.schema.json
                    jq empty tools/work-packages/templates/PACKAGE.example.json
                - name: Install dependencies
                  run: npm ci
                - name: Check source
                  run: npm run check
                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/engine.ts .github/workflows/ci.yml
          git commit -m "Use prototype-safe named arguments"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Build
        run: npm run build
