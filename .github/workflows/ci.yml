name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate work-package tooling
        run: |
          bash -n tools/work-packages/integrate.sh
          jq empty tools/work-packages/PACKAGE.schema.json
          jq empty tools/work-packages/templates/PACKAGE.example.json
      - name: Validate local-agent tooling
        run: |
          python3 -B tools/local-agent/test-replace-exact.py
          bash tools/local-agent/test-create-source-bundle.sh
          python3 -B tools/local-agent/test-patch-publication.py
          bash tools/local-agent/test-patch-publication-workflow.sh
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
