name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate work-package tooling
        run: |
          bash -n tools/work-packages/integrate.sh
          jq empty tools/work-packages/PACKAGE.schema.json
          jq empty tools/work-packages/templates/PACKAGE.example.json
      - name: Validate local-agent tooling
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/teasescript-local-agent-logs"
          mkdir -p "$log_dir"

          python3 -B tools/local-agent/test-compact-unittest.py
          python3 -B tools/local-agent/test-replace-exact.py
          python3 -B tools/local-agent/test-replace-exact-batch.py
          bash tools/local-agent/test-run-compact.sh
          bash tools/local-agent/run-compact.sh \
            --label source-bundle-workflow \
            --log "$log_dir/source-bundle-workflow.log" \
            -- env TEASESCRIPT_COMPACT_TEST_INNER=1 bash tools/local-agent/test-create-source-bundle.sh
          python3 -B tools/local-agent/test-prepare-source-review.py
          python3 -B tools/local-agent/test-patch-publication.py
          bash tools/local-agent/run-compact.sh \
            --label patch-publication-workflow \
            --log "$log_dir/patch-publication-workflow.log" \
            -- env TEASESCRIPT_COMPACT_TEST_INNER=1 bash tools/local-agent/test-patch-publication-workflow.sh
      - name: Upload local-agent failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-agent-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teasescript-local-agent-logs
          if-no-files-found: ignore
          retention-days: 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: npm run check
