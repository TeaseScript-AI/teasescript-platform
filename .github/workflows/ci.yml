name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate work-package tooling
        run: |
          bash -n tools/work-packages/integrate.sh
          python -m json.tool tools/work-packages/PACKAGE.schema.json > /dev/null
          python -m json.tool tools/work-packages/templates/PACKAGE.example.json > /dev/null
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Build
        run: npm run build
