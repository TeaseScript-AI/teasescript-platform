name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture focused reproduction
        continue-on-error: true
        run: |
          npm run build > issue-13.log 2>&1
          node --test dist/tests/visible-list-text-runtime.test.js >> issue-13.log 2>&1
      - name: Upload focused reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-13-reproduction
          path: issue-13.log
      - name: Check source
        run: npm run check
      - name: Build
        run: npm run build
