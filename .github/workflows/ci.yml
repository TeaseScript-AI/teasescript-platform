name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          show-progress: false
          # A pull request's merge commit and its base, to compare them below.
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select local-agent tooling check
        id: local-agent
        run: |
          # A pull request runs the tooling suites only when it changes one of their inputs; every push to main runs them.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash tools/local-agent/select-local-agent-check.sh HEAD^1 HEAD >>"$GITHUB_OUTPUT"
          else
            echo run=true >>"$GITHUB_OUTPUT"
          fi
      - name: Validate local-agent tooling
        if: ${{ steps.local-agent.outputs.run == 'true' }}
        run: bash tools/local-agent/check-local-agent.sh
      - name: Upload local-agent failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-agent-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teasescript-local-agent-logs
          if-no-files-found: ignore
          retention-days: 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: npm run check
