name: Export PR 117 workspace

on:
  push:
    branches:
      - feat/issue-110-foreground-interaction-runtime

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: pr117-workspace
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
