name: Fix issue 120 final verification metric

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-120-property-harness' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-120-property-harness
          fetch-depth: 0

      - name: Set up repository Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Correct final measured test count
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b4ee33aadeeafd9f2663fe12db9711a6b61ee48c HEAD
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/TESTING.md')
          text = path.read_text()
          old = 'passed `504` tests in about `7.74` seconds including build'
          new = 'passed `505` tests in about `7.40` seconds including build'
          if old not in text:
              raise SystemExit('expected stale verification metric not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-issue120-doc-metric.yml

      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm -rf dist
          npm run check
          npm run build
          git diff --check

      - name: Commit corrected metric
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/TESTING.md .github/workflows/fix-issue120-doc-metric.yml
          git diff --cached --check
          git commit -m 'Correct property harness verification metric'
          git push origin HEAD:agent/issue-120-property-harness
