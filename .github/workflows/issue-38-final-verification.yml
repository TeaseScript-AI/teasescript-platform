name: Issue 38 Final Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run exact verification
        shell: bash
        run: |
          set -o pipefail
          {
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm install "$(cat .nvmrc)"
            nvm use
            node --version
            npm --version
            npm ci
            npm run check
            npm run build
            node --test dist/tests/semantic-validation.test.js
            git fetch origin main
            git diff --check origin/main...HEAD
            git status --short
          } 2>&1 | tee issue-38-final-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-38-final-verification-log
          path: issue-38-final-verification.log
          retention-days: 1
