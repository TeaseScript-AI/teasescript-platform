name: Issue 38 Finalize Main

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Merge latest main and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          printf 'main=%s\n' "$(git rev-parse origin/main)" > issue-38-final-summary.log
          git merge --no-edit origin/main
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> issue-38-final-summary.log
          node --version >> issue-38-final-summary.log
          npm --version >> issue-38-final-summary.log
          npm ci
          npm run check > full-check.log 2>&1
          npm run build > build.log 2>&1
          node --test dist/tests/semantic-validation.test.js > focused.log 2>&1
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
          printf '\nFULL CHECK\n' >> issue-38-final-summary.log
          tail -n 20 full-check.log >> issue-38-final-summary.log
          printf '\nFOCUSED TEST\n' >> issue-38-final-summary.log
          tail -n 20 focused.log >> issue-38-final-summary.log
          printf '\nBUILD\n' >> issue-38-final-summary.log
          tail -n 10 build.log >> issue-38-final-summary.log
          printf '\nCLEAN STATUS\n' >> issue-38-final-summary.log
          git status --short >> issue-38-final-summary.log
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: issue-38-final-summary
          path: issue-38-final-summary.log
          retention-days: 1
