name: Issue 38 NVM Final Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run required verification with nvm
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install "$(cat .nvmrc)"
          nvm use
          node --version
          npm --version
          npm ci
          npm run check
          npm run build
          node --test dist/tests/semantic-validation.test.js
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
