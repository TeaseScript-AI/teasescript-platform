name: Apply issue 39 implementation

on:
  push:
    branches: [fix/issue-39-control-flow-regions]
    paths:
      - .github/workflows/issue-39-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-39-control-flow-regions
          fetch-depth: 0
      - name: Apply implementation and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/instructions.ts")
          source = source_path.read_text()
          old_call = '''    validateFunctionDefinitions(
                value.functions,
                value.instructions,
                value.rootEndInstruction,
                errors,
              );'''
          if old_call not in source:
              old_call = '''    validateFunctionDefinitions(
      value.functions,
      value.instructions,
      value.rootEndInstruction,
      errors,
    );'''
          new_call = '''    const functionErrorCount = errors.length;
    validateFunctionDefinitions(
      value.functions,
      value.instructions,
      value.rootEndInstruction,
      errors,
    );
    if (errors.length === functionErrorCount) {
      validateInstructionControlFlowRegions(
        value.instructions,
        value.rootEndInstruction,
        value.functions,
        errors,
      );
    }'''
          if source.count(old_call) != 1:
              raise SystemExit("validateFunctionDefinitions call site not found exactly once")
          source = source.replace(old_call, new_call, 1)

          marker = "\nfunction validateFunctionDefinitions(\n"
          if source.count(marker) != 1:
              raise SystemExit("validateFunctionDefinitions marker not found exactly once")
          helper = r'''
type InstructionExecutionRegion =
  | {
      readonly kind: "root";
      readonly startInstruction: 0;
      readonly endInstruction: number;
    }
  | {
      readonly kind: "function";
      readonly functionId: number;
      readonly startInstruction: number;
      readonly endInstruction: number;
    };

function validateInstructionControlFlowRegions(
  instructions: readonly unknown[],
  rootEndInstruction: unknown,
  functions: unknown,
  errors: PlanValidationError[],
): void {
  if (!nonNegativeInteger(rootEndInstruction) || !Array.isArray(functions)) return;

  const regions: Array<InstructionExecutionRegion | undefined> = new Array(
    instructions.length,
  );
  const rootRegion: InstructionExecutionRegion = {
    kind: "root",
    startInstruction: 0,
    endInstruction: rootEndInstruction,
  };
  for (let index = 0; index < rootEndInstruction; index += 1) {
    regions[index] = rootRegion;
  }

  for (const definition of functions) {
    if (
      !isRecord(definition) ||
      !nonNegativeInteger(definition.id) ||
      !nonNegativeInteger(definition.entryInstruction) ||
      !nonNegativeInteger(definition.endInstruction)
    ) {
      return;
    }
    const functionRegion: InstructionExecutionRegion = {
      kind: "function",
      functionId: definition.id,
      startInstruction: definition.entryInstruction,
      endInstruction: definition.endInstruction,
    };
    for (
      let index = definition.entryInstruction;
      index < definition.endInstruction;
      index += 1
    ) {
      regions[index] = functionRegion;
    }
  }

  instructions.forEach((instruction, instructionIndex) => {
    if (!isRecord(instruction)) return;
    const region = regions[instructionIndex];
    if (region === undefined) return;
    const instructionPath = `$.instructions[${instructionIndex}]`;
    switch (instruction.kind) {
      case "jump":
      case "jumpIfFalse":
      case "loopControl":
      case "prepareParameterDefault":
        validateInstructionRegionTarget(
          instruction.target,
          `${instructionPath}.target`,
          instructions.length,
          region,
          errors,
        );
        return;
      case "loopStart":
        validateInstructionRegionTarget(
          instruction.continueTarget,
          `${instructionPath}.continueTarget`,
          instructions.length,
          region,
          errors,
        );
        validateInstructionRegionTarget(
          instruction.target,
          `${instructionPath}.target`,
          instructions.length,
          region,
          errors,
        );
        return;
      case "callFunction":
        validateInstructionRegionTarget(
          instruction.returnInstruction,
          `${instructionPath}.returnInstruction`,
          instructions.length,
          region,
          errors,
        );
        return;
    }
  });
}

function validateInstructionRegionTarget(
  value: unknown,
  path: string,
  instructionCount: number,
  region: InstructionExecutionRegion,
  errors: PlanValidationError[],
): void {
  if (!Number.isInteger(value) || (value as number) < 0 || (value as number) > instructionCount) {
    return;
  }
  const target = value as number;
  const remainsInRegion = region.kind === "root"
    ? target >= region.startInstruction && target <= region.endInstruction
    : target >= region.startInstruction && target < region.endInstruction;
  if (!remainsInRegion) {
    errors.push(planError(
      "TSC002",
      "Control-flow target leaves the instruction's execution region.",
      path,
    ));
  }
}
'''
          source = source.replace(marker, helper + marker, 1)
          source_path.write_text(source)

          test_path = Path("tests/instruction-plan-validation.test.ts")
          tests = test_path.read_text()
          test_marker = 'test("preserves compiler-generated control flow, calls, and returns", () => {'
          if tests.count(test_marker) != 1:
              raise SystemExit("test insertion marker not found exactly once")
          extra_tests = r'''test("keeps function-call return targets inside the caller region", () => {
  const compiled = plan(rootBranchWithTwoFunctions());
  const callSource = [
    'function first { say "first" }',
    'function second { say "second" }',
    "first()",
    "exit",
  ].join("\n");
  const callable = plan(callSource);
  const callIndex = rootInstructionIndex(callable, "callFunction");
  const malformed = mutateTarget(
    callable,
    callIndex,
    "returnInstruction",
    callable.functions[1]!.bodyEntryInstruction,
  );

  assertRegionError(
    validateInstructionPlan(malformed),
    `$.instructions[${callIndex}].returnInstruction`,
  );
  assert.equal(validateInstructionPlan(compiled).valid, true);
});

test("keeps parameter-default targets inside their function region", () => {
  const compiled = plan([
    "function first(value = 1) { say value }",
    "function second { say 2 }",
    "first()",
    "exit",
  ].join("\n"));
  const first = compiled.functions[0]!;
  const prepareIndex = functionInstructionIndex(
    compiled,
    first.id,
    "prepareParameterDefault",
  );
  const malformed = mutateTarget(
    compiled,
    prepareIndex,
    "target",
    compiled.functions[1]!.entryInstruction,
  );

  assertRegionError(
    validateInstructionPlan(malformed),
    `$.instructions[${prepareIndex}].target`,
  );
});

'''
          tests = tests.replace(test_marker, extra_tests + test_marker, 1)
          test_path.write_text(tests)
          PY
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit and push implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git add src/instructions.ts tests/instruction-plan-validation.test.ts
          git commit -m "Reject control flow across execution regions"
          git push origin HEAD:fix/issue-39-control-flow-regions
