name: Debug issue 39 patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-39-control-flow-regions
      - name: Reproduce patch script
        id: patch
        continue-on-error: true
        run: |
          sed -n '25,254p' .github/workflows/issue-39-apply-patch.yml | sed 's/^          //' > /tmp/issue-39-apply.sh
          bash -x /tmp/issue-39-apply.sh > issue-39-patch.log 2>&1
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-39-patch-diagnostics
          path: issue-39-patch.log
      - name: Preserve patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
