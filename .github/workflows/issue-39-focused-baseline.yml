name: Issue 39 focused verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-39-control-flow-regions
          fetch-depth: 0
      - name: Correct validation ordering and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/instructions.ts")
          text = path.read_text()
          gated = '''    const functionErrorCount = errors.length;
    validateFunctionDefinitions(
      value.functions,
      value.instructions,
      value.rootEndInstruction,
      errors,
    );
    if (errors.length === functionErrorCount) {
      validateInstructionControlFlowRegions(
        value.instructions,
        value.rootEndInstruction,
        value.functions,
        errors,
      );
    }'''
          direct = '''    validateFunctionDefinitions(
      value.functions,
      value.instructions,
      value.rootEndInstruction,
      errors,
    );
    validateInstructionControlFlowRegions(
      value.instructions,
      value.rootEndInstruction,
      value.functions,
      errors,
    );'''
          if gated in text:
              text = text.replace(gated, direct, 1)
          elif direct not in text:
              raise SystemExit("instruction region validation call site not found")

          replacements = {
              '''        validateInstructionRegionTarget(
instruction.target,
`${instructionPath}.target`,
instructions.length,
region,
errors,
        );''': '''        validateInstructionRegionTarget(
          instruction.target,
          `${instructionPath}.target`,
          instructions.length,
          region,
          errors,
        );''',
              '''        validateInstructionRegionTarget(
instruction.continueTarget,
`${instructionPath}.continueTarget`,
instructions.length,
region,
errors,
        );''': '''        validateInstructionRegionTarget(
          instruction.continueTarget,
          `${instructionPath}.continueTarget`,
          instructions.length,
          region,
          errors,
        );''',
              '''        validateInstructionRegionTarget(
instruction.returnInstruction,
`${instructionPath}.returnInstruction`,
instructions.length,
region,
errors,
        );''': '''        validateInstructionRegionTarget(
          instruction.returnInstruction,
          `${instructionPath}.returnInstruction`,
          instructions.length,
          region,
          errors,
        );''',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run focused tests
        run: node --test dist/tests/instruction-plan-validation.test.js
      - name: Commit and push correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git add src/instructions.ts
          git commit -m "Validate specialized targets against execution regions"
          git push origin HEAD:fix/issue-39-control-flow-regions
