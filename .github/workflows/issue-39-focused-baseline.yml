name: Issue 39 focused baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run focused failing-before tests
        id: focused
        continue-on-error: true
        run: node --test dist/tests/instruction-plan-validation.test.js > issue-39-focused.log 2>&1
      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-39-focused-baseline
          path: issue-39-focused.log
      - name: Preserve focused failure
        if: steps.focused.outcome == 'failure'
        run: exit 1
