name: Debug issue 42 implementation patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    if: github.head_ref == 'fix/issue-42-bounded-runtime-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-42-bounded-runtime-validation
          fetch-depth: 0
      - name: Check implementation patch
        id: patch
        continue-on-error: true
        run: |
          base64 --decode tools/issue42.patch.gz.b64 > /tmp/issue42.patch.gz
          gunzip -c /tmp/issue42.patch.gz > /tmp/issue42.patch
          git apply --verbose --check /tmp/issue42.patch > issue-42-apply.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-42-apply-diagnostics
          path: issue-42-apply.log
      - name: Preserve failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
