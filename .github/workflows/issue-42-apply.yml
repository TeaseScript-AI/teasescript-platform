name: Apply issue 42 implementation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/issue-42-bounded-runtime-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-42-bounded-runtime-validation
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          base64 --decode tools/issue42.patch.gz.b64 > /tmp/issue42.patch.gz
          gunzip -c /tmp/issue42.patch.gz > /tmp/issue42.patch
          git apply --check /tmp/issue42.patch
          git apply /tmp/issue42.patch
          rm .github/workflows/issue-42-apply.yml
          rm .github/workflows/issue-42-baseline-evidence.yml
          rm tools/issue42.patch.gz.b64
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: |
          npm run build
          node --test dist/tests/external-runtime-data-limits.test.js
      - name: Run full verification
        run: |
          npm run check
          npm run build
      - name: Commit and push implementation
        run: |
          git add -A
          git commit -m "Bound validation of external runtime data"
          git status --short
          test -z "$(git status --short)"
          git push origin HEAD:fix/issue-42-bounded-runtime-validation
