name: Issue 42 baseline evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out failing-before commit
        uses: actions/checkout@v4
        with:
          ref: 749e6f14c524d16493dc7b271c3932cc59ed53dd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Capture baseline evidence
        run: |
          cat > /tmp/issue-42-probe.mjs <<'EOF'
          import {
            compileSource,
            createCheckpoint,
            createFreshRuntimeSnapshot,
            deserializeCheckpoint,
            restoreCheckpoint,
            validateInstructionPlan,
            validateRuntimeSnapshot,
          } from "${{ github.workspace }}/dist/src/index.js";

          const depth = 20_000;
          const plan = compileSource("exit").plan;
          const nestedArray = JSON.parse(`${"[".repeat(depth)}0${"]".repeat(depth)}`);
          const nestedListJson = `${'{"kind":"list","items":['.repeat(depth)}"leaf"${"]}".repeat(depth)}`;
          const nestedList = JSON.parse(nestedListJson);
          console.log(`node=${process.version}`);
          console.log(`depth=${depth}`);
          console.log("deep-array-json-parse=success");
          console.log("deep-list-json-parse=success");

          function record(name, operation) {
            try {
              operation();
              console.log(`${name}=returned`);
            } catch (error) {
              console.log(`${name}=${error?.name}: ${error?.message}`);
            }
          }

          const externalPlan = JSON.parse(JSON.stringify(plan));
          externalPlan.padding = nestedArray;
          record("validateInstructionPlan", () => validateInstructionPlan(externalPlan));

          const externalSnapshot = JSON.parse(JSON.stringify(createFreshRuntimeSnapshot(plan)));
          externalSnapshot.frames[0].bindings.push({ name: "deep", value: nestedList });
          record("validateRuntimeSnapshot", () => validateRuntimeSnapshot(externalSnapshot, plan));

          const externalCheckpoint = JSON.parse(JSON.stringify(
            createCheckpoint(plan, createFreshRuntimeSnapshot(plan)),
          ));
          externalCheckpoint.plan.padding = nestedArray;
          record("restoreCheckpoint", () => restoreCheckpoint(externalCheckpoint));

          const textCheckpoint = JSON.parse(JSON.stringify(
            createCheckpoint(plan, createFreshRuntimeSnapshot(plan)),
          ));
          textCheckpoint.snapshot.frames[0].bindings.push({
            name: "deep",
            value: "__DEEP_VALUE__",
          });
          const json = JSON.stringify(textCheckpoint).replace(
            '"__DEEP_VALUE__"',
            nestedListJson,
          );
          JSON.parse(json);
          console.log("checkpoint-json-parse=success");
          record("deserializeCheckpoint", () => deserializeCheckpoint(json));
          EOF
          node /tmp/issue-42-probe.mjs | tee issue-42-baseline.log
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-42-baseline-evidence
          path: issue-42-baseline.log
