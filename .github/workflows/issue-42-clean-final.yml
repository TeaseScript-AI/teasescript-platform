name: Clean final issue 42 verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'fix/issue-42-bounded-runtime-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-42-bounded-runtime-validation
          fetch-depth: 0
      - name: Remove temporary workflow from final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-42-clean-final.yml
          git commit --amend --no-edit --allow-empty
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify versions
        run: |
          echo "node=$(node --version)" | tee /tmp/issue-42-clean-final.log
          echo "npm=$(npm --version)" | tee -a /tmp/issue-42-clean-final.log
      - name: Install dependencies
        run: npm ci 2>&1 | tee -a /tmp/issue-42-clean-final.log
      - name: Run complete check
        run: npm run check 2>&1 | tee -a /tmp/issue-42-clean-final.log
      - name: Run build
        run: npm run build 2>&1 | tee -a /tmp/issue-42-clean-final.log
      - name: Run focused compiled tests
        run: node --test dist/tests/external-runtime-data-limits.test.js 2>&1 | tee -a /tmp/issue-42-clean-final.log
      - name: Verify latest main, diff and exact status
        run: |
          git fetch origin main
          echo "main=$(git rev-parse origin/main)" | tee -a /tmp/issue-42-clean-final.log
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main...HEAD
          git status --short | tee /tmp/issue-42-status.log
          test ! -s /tmp/issue-42-status.log
          echo "head=$(git rev-parse HEAD)" | tee -a /tmp/issue-42-clean-final.log
          echo "git-status-short=clean" | tee -a /tmp/issue-42-clean-final.log
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-42-clean-final-verification
          path: /tmp/issue-42-clean-final.log
      - name: Push final head
        run: git push origin HEAD:fix/issue-42-bounded-runtime-validation
