name: Finalize issue 42 branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/issue-42-bounded-runtime-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-42-bounded-runtime-validation
          fetch-depth: 0
      - name: Merge latest main normally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          printf 'starting-main=9c5736e8ddaf48f9c265329c913c4d2efa427bcc\n' | tee issue-42-final.log
          printf 'final-main=%s\n' "$(git rev-parse origin/main)" | tee -a issue-42-final.log
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/issue-42-finalize.yml
          git commit --amend --no-edit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record versions
        run: |
          printf 'node=%s\n' "$(node --version)" | tee -a issue-42-final.log
          printf 'npm=%s\n' "$(npm --version)" | tee -a issue-42-final.log
      - name: Install dependencies
        run: npm ci 2>&1 | tee -a issue-42-final.log
      - name: Build for focused tests
        run: npm run build 2>&1 | tee -a issue-42-final.log
      - name: Run focused compiled tests
        run: node --test dist/tests/external-runtime-data-limits.test.js 2>&1 | tee -a issue-42-final.log
      - name: Run full checks
        run: npm run check 2>&1 | tee -a issue-42-final.log
      - name: Run final build
        run: npm run build 2>&1 | tee -a issue-42-final.log
      - name: Verify ancestry, diff and worktree
        run: |
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main...HEAD
          test -z "$(git status --short --untracked-files=no)"
          printf 'head=%s\n' "$(git rev-parse HEAD)" | tee -a issue-42-final.log
          printf 'tracked-worktree=clean\n' | tee -a issue-42-final.log
      - name: Upload final verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-42-final-verification
          path: issue-42-final.log
      - name: Push finalized branch
        run: git push origin HEAD:fix/issue-42-bounded-runtime-validation
