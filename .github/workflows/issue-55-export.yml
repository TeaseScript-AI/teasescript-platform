name: Issue 55 workspace export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/issue-55-stable-external-data-capture'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-55-stable-external-data-capture
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create workspace archive
        run: |
          tar --exclude=.git --exclude=.github/workflows/issue-55-export.yml -czf /tmp/issue-55-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: issue-55-workspace
          path: /tmp/issue-55-workspace.tar.gz
          compression-level: 0
