name: Issue 58 failing-before evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.head_ref == 'fix/issue-55-stable-external-data-capture'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact starting main
        uses: actions/checkout@v4
        with:
          ref: 09a3b143beb12b7c9ecf02e5c7f03a0116123ee3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Count duplicate-membership comparisons
        run: |
          cat > /tmp/issue-58-probe.mjs <<'EOF'
          import {
            createSerializableSet,
          } from "${{ github.workspace }}/dist/src/index.js";
          import {
            validateSerializableValue,
          } from "${{ github.workspace }}/dist/src/runtime/serializable-values.js";

          const size = 4096;
          const values = Array.from({ length: size }, (_, index) => index);
          const originalSome = Array.prototype.some;
          let predicateCalls = 0;
          Array.prototype.some = function countedSome(predicate, thisArg) {
            return originalSome.call(this, (value, index, array) => {
              predicateCalls += 1;
              return predicate.call(thisArg, value, index, array);
            });
          };

          console.log(`node=${process.version}`);
          console.log("main=09a3b143beb12b7c9ecf02e5c7f03a0116123ee3");
          console.log(`size=${size}`);

          predicateCalls = 0;
          const validationFailure = validateSerializableValue({ kind: "set", items: values });
          console.log(`validation.failure=${validationFailure}`);
          console.log(`validation.predicateCalls=${predicateCalls}`);
          console.log(`validation.expectedQuadratic=${size * (size - 1) / 2}`);

          predicateCalls = 0;
          const constructed = createSerializableSet(values);
          console.log(`construction.length=${constructed.items.length}`);
          console.log(`construction.predicateCalls=${predicateCalls}`);
          console.log(`construction.expectedQuadratic=${size * (size - 1) / 2}`);

          Array.prototype.some = originalSome;
          EOF
          node /tmp/issue-58-probe.mjs | tee issue-58-failing-before.log
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-58-failing-before
          path: issue-58-failing-before.log
