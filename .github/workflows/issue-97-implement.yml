name: Implement issue 97
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-97-linear-fresh-globals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          state = Path('src/runtime/state.ts')
          text = state.read_text()
          old = '''    if (bindings.some((binding) => binding.name === name)) {
              throw new TypeError(`Duplicate global '${name}'.`);
            }
          '''
          if old not in text:
              raise SystemExit('expected duplicate-global scan not found')
          state.write_text(text.replace(old, '', 1))

          security = Path('docs/SECURITY.md')
          text = security.read_text()
          anchor = '- Keep serializable-set validation and reconstruction linear while preserving insertion order, scalar equality, and the canonical array representation.\n'
          addition = anchor + '- Fresh-runtime global initialization consumes each already captured unique own global property once; it does not rescan previously constructed bindings.\n'
          if anchor not in text:
              raise SystemExit('security documentation anchor not found')
          security.write_text(text.replace(anchor, addition, 1))
          PY
          cat > tests/fresh-runtime-globals-linear.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import {
            compileSource,
            createFreshRuntimeSnapshot,
            type SerializableRuntimeValue,
          } from "../src/index.js";

          test("fresh global initialization does not rescan previously constructed bindings", () => {
            const compiled = compileSource("exit");
            assert.deepEqual(compiled.diagnostics, []);
            assert.notEqual(compiled.plan, null);

            const globals: Record<string, SerializableRuntimeValue> = Object.create(null);
            const count = 2_000;
            for (let index = 0; index < count; index += 1) {
              globals[`global${index}`] = index;
            }

            const originalSome = Array.prototype.some;
            let bindingComparisons = 0;
            Array.prototype.some = function <T>(
              this: T[],
              predicate: (value: T, index: number, array: T[]) => unknown,
              thisArg?: unknown,
            ): boolean {
              return originalSome.call(this, (value: T, index: number, array: T[]) => {
                if (
                  value !== null &&
                  typeof value === "object" &&
                  Object.hasOwn(value, "name") &&
                  Object.hasOwn(value, "value")
                ) {
                  bindingComparisons += 1;
                }
                return predicate.call(thisArg, value, index, array);
              });
            };
            try {
              const snapshot = createFreshRuntimeSnapshot(compiled.plan!, { globals });
              assert.equal(snapshot.frames[0]?.bindings.length, count);
              assert.deepEqual(
                snapshot.frames[0]?.bindings.slice(0, 3).map((binding) => binding.name),
                ["global0", "global1", "global2"],
              );
              assert.equal(snapshot.frames[0]?.bindings.at(-1)?.name, `global${count - 1}`);
            } finally {
              Array.prototype.some = originalSome;
            }
            assert.equal(bindingComparisons, 0);
          });
          EOF
          git diff --check
      - name: Verify
        run: |
          npm ci
          npm run build
          node --test dist/tests/fresh-runtime-globals-linear.test.js dist/tests/external-runtime-data-limits.test.js
          npm run check
          npm run build
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'Codex for TeaseScript AI'
          git config user.email '219006439+wqaed401@users.noreply.github.com'
          git add src/runtime/state.ts docs/SECURITY.md tests/fresh-runtime-globals-linear.test.ts
          git commit -m 'Make fresh runtime global initialization linear'
          git push origin HEAD:fix/issue-97-linear-fresh-globals
