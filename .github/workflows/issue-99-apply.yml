name: Apply issue 99 implementation
on:
  push:
    branches:
      - fix/issue-99-prototype-safe-captured-arrays
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-99-prototype-safe-captured-arrays
          fetch-depth: 0
      - name: Skip until patch exists
        id: patch
        shell: bash
        run: |
          if [[ -f .issue-99.patch ]]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.patch.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply patch
        if: steps.patch.outputs.present == 'true'
        run: |
          git apply --check .issue-99.patch
          git apply .issue-99.patch
          git diff --check
      - name: Verify implementation
        if: steps.patch.outputs.present == 'true'
        run: |
          npm ci
          npm run build
          node --test dist/tests/prototype-safe-captured-arrays.test.js dist/tests/external-runtime-data-limits.test.js dist/tests/library-catalog-metadata.test.js
          npm run check
          npm run build
          git diff --check
      - name: Commit implementation
        if: steps.patch.outputs.present == 'true'
        run: |
          git config user.name 'Codex for TeaseScript AI'
          git config user.email '219006439+wqaed401@users.noreply.github.com'
          git add src/external-data-limits.ts src/libraries/metadata.ts docs/SECURITY.md tests/prototype-safe-captured-arrays.test.ts
          git rm .issue-99.patch .github/workflows/issue-99-apply.yml
          git commit -m 'Make captured sparse arrays prototype-safe'
          git push origin HEAD:fix/issue-99-prototype-safe-captured-arrays
