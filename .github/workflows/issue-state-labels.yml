name: Clear state labels on close

# A closed issue is no longer being worked on or waiting for the owner, so "in progress" and every "owner:" label go
# (docs/DEVELOPMENT-WORKFLOW.md, "Labels"). Issues closed by "Closes #N" on a merge come here too.
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  clear:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Remove "in progress" and "owner:" labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          jq -r '.[]' <<< "$LABELS" | while IFS= read -r label; do
            case "$label" in
              "in progress" | "owner: "*)
                gh issue edit "$NUMBER" --repo "$REPOSITORY" --remove-label "$label"
                echo "Removed '$label' from #$NUMBER"
                ;;
            esac
          done
