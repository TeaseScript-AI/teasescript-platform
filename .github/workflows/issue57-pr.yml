name: Issue 57 PR implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-57-bounded-function-range-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply focused patch
        shell: bash
        run: |
          cat .issue57/part* | base64 --decode > /tmp/issue57.patch
          git apply --check /tmp/issue57.patch
          git apply /tmp/issue57.patch
      - name: Record environment
        shell: bash
        run: |
          mkdir -p /tmp/issue57-verification
          node --version > /tmp/issue57-verification/node-version.txt
          npm --version > /tmp/issue57-verification/npm-version.txt
      - name: Install dependencies
        run: npm ci
      - name: Capture complete check
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/issue57-verification/check.txt
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue57-check-diagnostic
          path: /tmp/issue57-verification
      - name: Preserve failure status
        if: steps.check.outcome != 'success'
        run: exit 1
