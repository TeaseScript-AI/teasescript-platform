name: Issue 65 baseline reproduction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-65-sparse-array-work-bound
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and build baseline
        run: |
          node --version | tee /tmp/node-version.txt
          npm --version | tee /tmp/npm-version.txt
          npm ci
          rm -rf dist
          npm run build
      - name: Reproduce sparse-array hang safely
        id: reproduce
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/issue65-repro.mjs <<'EOF'
          import { pathToFileURL } from "node:url";
          const moduleUrl = pathToFileURL(`${process.cwd()}/dist/src/index.js`).href;
          const { cloneSerializableValue } = await import(moduleUrl);
          const items = [];
          items.length = 0xffff_ffff;
          console.log("before cloneSerializableValue");
          cloneSerializableValue({ kind: "list", items });
          console.log("after cloneSerializableValue");
          EOF
          set +e
          start_ns=$(date +%s%N)
          timeout --signal=KILL 2s node /tmp/issue65-repro.mjs > /tmp/repro-stdout.txt 2> /tmp/repro-stderr.txt
          status=$?
          end_ns=$(date +%s%N)
          set -e
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          {
            echo "baseline=$(git merge-base HEAD origin/main)"
            echo "branch_head=$(git rev-parse HEAD)"
            echo "timeout_seconds=2"
            echo "elapsed_ms=$elapsed_ms"
            echo "exit_status=$status"
            echo "stdout:"
            cat /tmp/repro-stdout.txt
            echo "stderr:"
            cat /tmp/repro-stderr.txt
          } | tee /tmp/issue65-baseline-evidence.txt
          if [[ "$status" != "137" && "$status" != "124" ]]; then
            exit 1
          fi
          grep -Fx "before cloneSerializableValue" /tmp/repro-stdout.txt
          ! grep -Fx "after cloneSerializableValue" /tmp/repro-stdout.txt
      - name: Capture source checkout
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/issue65-checkout.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue65-baseline
          path: |
            /tmp/issue65-baseline-evidence.txt
            /tmp/repro-stdout.txt
            /tmp/repro-stderr.txt
            /tmp/node-version.txt
            /tmp/npm-version.txt
            /tmp/issue65-checkout.tar.gz
      - name: Preserve reproduction status
        if: always()
        run: test '${{ steps.reproduce.outcome }}' = success
