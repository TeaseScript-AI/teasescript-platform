name: Issue 65 baseline reproduction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-65-sparse-array-work-bound
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and build baseline
        run: |
          node --version | tee /tmp/node-version.txt
          npm --version | tee /tmp/npm-version.txt
          npm ci
          rm -rf dist
          npm run build
      - name: Reproduce sparse serializable-value mapping
        shell: bash
        run: |
          cat > /tmp/issue65-value-repro.mjs <<'EOF'
          import { pathToFileURL } from "node:url";
          const moduleUrl = pathToFileURL(`${process.cwd()}/dist/src/index.js`).href;
          const { cloneSerializableValue } = await import(moduleUrl);
          const items = [];
          items.length = 0xffff_ffff;
          try {
            cloneSerializableValue({ kind: "list", items });
            console.log(JSON.stringify({ returned: true }));
          } catch (error) {
            console.log(JSON.stringify({
              name: error?.name,
              code: error?.code,
              message: error?.message,
            }));
          }
          EOF
          node /tmp/issue65-value-repro.mjs | tee /tmp/value-repro.txt
      - name: Reproduce sparse plan hang safely
        id: reproduce
        shell: bash
        run: |
          cat > /tmp/issue65-plan-repro.mjs <<'EOF'
          import { pathToFileURL } from "node:url";
          const moduleUrl = pathToFileURL(`${process.cwd()}/dist/src/index.js`).href;
          const { compileSource, validateInstructionPlan } = await import(moduleUrl);
          const original = compileSource("exit").plan;
          const malformed = JSON.parse(JSON.stringify(original));
          malformed.instructions.length = 0xffff_ffff;
          console.log("before validateInstructionPlan");
          validateInstructionPlan(malformed);
          console.log("after validateInstructionPlan");
          EOF
          set +e
          start_ns=$(date +%s%N)
          timeout --signal=KILL 2s node /tmp/issue65-plan-repro.mjs > /tmp/plan-stdout.txt 2> /tmp/plan-stderr.txt
          status=$?
          end_ns=$(date +%s%N)
          set -e
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          {
            echo "baseline=$(git merge-base HEAD origin/main)"
            echo "branch_head=$(git rev-parse HEAD)"
            echo "timeout_seconds=2"
            echo "elapsed_ms=$elapsed_ms"
            echo "exit_status=$status"
            echo "stdout:"
            cat /tmp/plan-stdout.txt
            echo "stderr:"
            cat /tmp/plan-stderr.txt
            echo "serializable_value_result:"
            cat /tmp/value-repro.txt
          } | tee /tmp/issue65-baseline-evidence.txt
          [[ "$status" == "137" || "$status" == "124" ]]
          grep -Fx "before validateInstructionPlan" /tmp/plan-stdout.txt
          ! grep -Fx "after validateInstructionPlan" /tmp/plan-stdout.txt
      - name: Capture source checkout
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/issue65-checkout.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue65-baseline
          path: |
            /tmp/issue65-baseline-evidence.txt
            /tmp/value-repro.txt
            /tmp/plan-stdout.txt
            /tmp/plan-stderr.txt
            /tmp/node-version.txt
            /tmp/npm-version.txt
            /tmp/issue65-checkout.tar.gz
