name: Issue 66 handoff

on:
  push:
    branches:
      - feat/issue-66-blocking-wait-pending-actions

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-66-blocking-wait-pending-actions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply current local work
        shell: bash
        run: |
          cat .issue66/gz-00.b64 .issue66/gz-01.b64 .issue66/gz-02.b64 .issue66/gz-03.b64 \
            | base64 --decode > /tmp/issue66.patch.gz
          gzip -dc /tmp/issue66.patch.gz > /tmp/issue66.patch
          git apply --check /tmp/issue66.patch
          git apply /tmp/issue66.patch
          git diff --check

      - name: Record environment and verification
        shell: bash
        run: |
          mkdir -p /tmp/issue66-handoff
          node --version | tee /tmp/issue66-handoff/node-version.txt
          npm --version | tee /tmp/issue66-handoff/npm-version.txt
          git status --short | tee /tmp/issue66-handoff/status-before.txt
          git diff --check 2>&1 | tee /tmp/issue66-handoff/diff-check.txt

          set +e
          npm ci 2>&1 | tee /tmp/issue66-handoff/npm-ci.txt
          npm_ci_status=${PIPESTATUS[0]}

          npm run build 2>&1 | tee /tmp/issue66-handoff/build.txt
          build_status=${PIPESTATUS[0]}

          npm run check 2>&1 | tee /tmp/issue66-handoff/check.txt
          check_status=${PIPESTATUS[0]}
          set -e

          {
            echo "npm_ci_status=$npm_ci_status"
            echo "build_status=$build_status"
            echo "check_status=$check_status"
          } | tee /tmp/issue66-handoff/statuses.txt

      - name: Commit implementation and tests
        shell: bash
        run: |
          git config user.name "Issue 66 Handoff"
          git config user.email "issue66-handoff@users.noreply.github.com"

          git add \
            playground/browser.ts \
            src/ast.ts \
            src/index.ts \
            src/instructions.ts \
            src/lexer.ts \
            src/parser.ts \
            src/runtime/checkpoint.ts \
            src/runtime/engine.ts \
            src/runtime/events.ts \
            src/runtime/state.ts \
            src/semantic.ts \
            src/token.ts
          git commit -m "Implement initial blocking wait pending-action path"

          git add \
            tests/control-flow-runtime.test.ts \
            tests/functions-checkpoint.test.ts \
            tests/lexer.test.ts \
            tests/pending-actions-runtime.test.ts \
            tests/pending-actions-validation.test.ts \
            tests/token.test.ts \
            tests/wait-syntax.test.ts
          git commit -m "Add initial wait and pending-action tests"

      - name: Remove handoff transport files
        shell: bash
        run: |
          git rm -r .issue66
          git rm .github/workflows/issue66-source-checkout.yml
          git rm .github/workflows/issue66-handoff.yml
          git commit -m "Remove temporary issue 66 handoff files"

      - name: Record final handoff state
        shell: bash
        run: |
          git fetch origin main
          git status --short | tee /tmp/issue66-handoff/status-after.txt
          git log --oneline --decorate -n 10 | tee /tmp/issue66-handoff/log.txt
          git diff --check origin/main...HEAD 2>&1 | tee /tmp/issue66-handoff/final-diff-check.txt
          git diff --name-only origin/main...HEAD | tee /tmp/issue66-handoff/changed-files.txt
          git diff --stat origin/main...HEAD | tee /tmp/issue66-handoff/diff-stat.txt
          git rev-parse origin/main | tee /tmp/issue66-handoff/final-main.txt
          git rev-parse HEAD | tee /tmp/issue66-handoff/final-head.txt
          test -z "$(git status --short)"

      - name: Push handoff commits
        run: git push origin HEAD:feat/issue-66-blocking-wait-pending-actions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue66-handoff
          path: /tmp/issue66-handoff
