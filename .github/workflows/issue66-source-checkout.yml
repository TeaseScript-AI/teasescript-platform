name: Issue 66 source checkout

on:
  push:
    branches:
      - feat/issue-66-blocking-wait-pending-actions

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-66-blocking-wait-pending-actions
          fetch-depth: 0
      - name: Record baseline
        run: |
          mkdir -p /tmp/issue66-source
          git rev-parse HEAD | tee /tmp/issue66-source/branch-head.txt
          git rev-parse origin/main | tee /tmp/issue66-source/main-head.txt
          cat .nvmrc | tee /tmp/issue66-source/nvmrc.txt
      - name: Archive source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/issue66-source/repository.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: issue66-source
          path: /tmp/issue66-source
