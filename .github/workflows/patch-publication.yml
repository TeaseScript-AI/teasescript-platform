name: Publish verified patch

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  prepare:
    if: startsWith(github.event.comment.body, '/publish-patch ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      transfer_branch: ${{ steps.request.outputs.transfer_branch }}
      expected_transfer_sha: ${{ steps.request.outputs.expected_transfer_sha }}
      expected_manifest_sha256: ${{ steps.request.outputs.expected_manifest_sha256 }}
      expected_target_branch: ${{ steps.request.outputs.expected_target_branch }}
      issue_number: ${{ steps.request.outputs.issue_number }}
      comment_id: ${{ steps.request.outputs.comment_id }}
      request_validated: ${{ steps.bind.outputs.validated }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      expected_base_sha: ${{ steps.prepare.outputs.expected_base_sha }}
      expected_result_tree_sha: ${{ steps.prepare.outputs.expected_result_tree_sha }}
      candidate_commit_sha: ${{ steps.prepare.outputs.candidate_commit_sha }}
      validation_profile: ${{ steps.prepare.outputs.validation_profile }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate publication command
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const request = require('./tools/local-agent/patch-publication-request.cjs');
            await request({ github, context, core });

      - name: Bind validated publication request
        id: bind
        env:
          TRANSFER_BRANCH: ${{ steps.request.outputs.transfer_branch }}
          EXPECTED_TRANSFER_SHA: ${{ steps.request.outputs.expected_transfer_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.request.outputs.expected_manifest_sha256 }}
          EXPECTED_TARGET_BRANCH: ${{ steps.request.outputs.expected_target_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            printf 'TRANSFER_BRANCH=%s\n' "$TRANSFER_BRANCH"
            printf 'EXPECTED_TRANSFER_SHA=%s\n' "$EXPECTED_TRANSFER_SHA"
            printf 'EXPECTED_MANIFEST_SHA256=%s\n' "$EXPECTED_MANIFEST_SHA256"
            printf 'EXPECTED_TARGET_BRANCH=%s\n' "$EXPECTED_TARGET_BRANCH"
            printf 'DEFAULT_BRANCH=%s\n' "$DEFAULT_BRANCH"
          } >> "$GITHUB_ENV"
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"

      - name: Preserve trusted publication tools
        run: |
          install -m 0755 tools/local-agent/patch-publication.py \
            "$RUNNER_TEMP/patch-publication.py"
          install -m 0755 tools/local-agent/patch-publication-prepare-steps.sh \
            "$RUNNER_TEMP/patch-publication-prepare-steps.sh"

      - name: Read exact transfer manifest
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" read-manifest
      - name: Verify authorized manifest digest
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" verify-manifest
      - name: Materialize exact patch payload
        id: materialize
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" materialize
      - name: Inspect request
        id: inspect
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" inspect
      - name: Check out exact target base
        env:
          TARGET_BRANCH: ${{ steps.inspect.outputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ steps.inspect.outputs.expected_base_sha }}
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" checkout-base
      - name: Prepare exact candidate bundle
        id: prepare
        run: bash "$RUNNER_TEMP/patch-publication-prepare-steps.sh" prepare
      - name: Name candidate artifact
        id: names
        run: echo "artifact_name=patch-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Preserve trusted candidate validation driver
        run: install -m 0755 tools/local-agent/patch-publication-validate-candidate.sh "$RUNNER_TEMP/validate-candidate"

      - name: Download prepared candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication

      - name: Verify exact candidate identity and target base
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          CANDIDATE_COMMIT_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.expected_base_sha }}
          EXPECTED_RESULT_TREE_SHA: ${{ needs.prepare.outputs.expected_result_tree_sha }}
        run: bash "$RUNNER_TEMP/validate-candidate" verify-identity

      - name: Set up Node.js for executable candidate checks
        if: ${{ needs.prepare.outputs.validation_profile != 'docs' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate candidate against selected risks
        run: bash "$RUNNER_TEMP/validate-candidate" validate-profile "${{ needs.prepare.outputs.validation_profile }}"

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published_commit_sha: ${{ steps.verify.outputs.candidate_commit_sha }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Preserve trusted publication tool
        run: install -m 0755 tools/local-agent/patch-publication.py "$RUNNER_TEMP/patch-publication.py"

      - name: Download tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication

      - name: Fetch expected target base
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.expected_base_sha }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/patch-target"
          actual_base_sha="$(git rev-parse refs/remotes/origin/patch-target)"
          if [[ "$actual_base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Target branch moved: expected $EXPECTED_BASE_SHA, found $actual_base_sha" >&2
            exit 1
          fi

      - name: Verify candidate without executing it
        id: verify
        env:
          VALIDATION_PROFILE: ${{ needs.prepare.outputs.validation_profile }}
        run: |
          python3 -B "$RUNNER_TEMP/patch-publication.py" verify-bundle \
            --repository "$GITHUB_WORKSPACE" \
            --metadata "$RUNNER_TEMP/publication/publication.json" \
            --bundle "$RUNNER_TEMP/publication/publication.bundle" \
            --expected-validation-profile "$VALIDATION_PROFILE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create scoped patch publisher token
        id: patch-publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PATCH_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PATCH_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Publish by non-force fast-forward
        env:
          TARGET_BRANCH: ${{ steps.verify.outputs.target_branch }}
          CANDIDATE_COMMIT_SHA: ${{ steps.verify.outputs.candidate_commit_sha }}
          PATCH_PUBLISHER_TOKEN: ${{ steps.patch-publisher-token.outputs.token }}
        run: |
          git push --porcelain \
            "https://x-access-token:${PATCH_PUBLISHER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$CANDIDATE_COMMIT_SHA:refs/heads/$TARGET_BRANCH"

  cleanup-transfer:
    if: ${{ always() && needs.prepare.outputs.request_validated == 'true' }}
    needs: [prepare, test, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      cleanup_status: ${{ steps.cleanup_transfer.outputs.cleanup_status }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Clean up exact transfer ref
        id: cleanup_transfer
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_BRANCH: ${{ needs.prepare.outputs.transfer_branch }}
          EXPECTED_TRANSFER_SHA: ${{ needs.prepare.outputs.expected_transfer_sha }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: bash tools/local-agent/patch-publication-cleanup-transfer.sh
  cleanup-comment:
    if: ${{ always() && needs.prepare.outputs.request_validated == 'true' }}
    needs: [prepare, test, publish, cleanup-transfer]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Delete exact accepted publication command
        id: cleanup_comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_ID: ${{ needs.prepare.outputs.comment_id }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          TRANSFER_BRANCH: ${{ needs.prepare.outputs.transfer_branch }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.expected_manifest_sha256 }}
        with:
          script: |
            const cleanup = require('./tools/local-agent/patch-publication-cleanup-comment.cjs');
            await cleanup({ github, context, core, process });
      - name: Record publication result
        if: ${{ always() }}
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch || needs.prepare.outputs.expected_target_branch }}
          PUBLISHED_COMMIT_SHA: ${{ needs.publish.outputs.published_commit_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TRANSFER_CLEANUP_STATUS: ${{ needs.cleanup-transfer.outputs.cleanup_status }}
          COMMENT_CLEANUP_STATUS: ${{ steps.cleanup_comment.outputs.cleanup_status }}
        run: bash tools/local-agent/patch-publication-summary.sh
