name: Publish verified patch

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    if: startsWith(github.event.comment.body, '/publish-patch ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      transfer_branch: ${{ steps.request.outputs.transfer_branch }}
      expected_transfer_sha: ${{ steps.request.outputs.expected_transfer_sha }}
      expected_manifest_sha256: ${{ steps.request.outputs.expected_manifest_sha256 }}
      expected_target_branch: ${{ steps.request.outputs.expected_target_branch }}
      issue_number: ${{ steps.request.outputs.issue_number }}
      comment_id: ${{ steps.request.outputs.comment_id }}
    steps:
      - name: Validate publication command
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const match = /^\/publish-patch ([A-Za-z0-9][A-Za-z0-9._\/-]{0,239}) ([0-9a-f]{64})$/.exec(body);
            if (!match) {
              core.setFailed('Use exactly: /publish-patch agent-patch-publication/<unique-id> <manifest-sha256>');
              return;
            }

            const transferBranch = match[1];
            const expectedManifestSha256 = match[2];
            if (
              !transferBranch.startsWith('agent-patch-publication/') ||
              transferBranch === 'agent-patch-publication/' ||
              transferBranch.includes('..') ||
              transferBranch.includes('//') ||
              transferBranch.endsWith('/')
            ) {
              core.setFailed('Invalid transfer branch name.');
              return;
            }

            if (!context.payload.issue.pull_request) {
              core.setFailed('Patch publication commands must be placed on a pull request.');
              return;
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed('Patch publication requires repository write permission.');
              return;
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pull.data.head.repo?.full_name !== context.payload.repository.full_name) {
              core.setFailed('Cross-repository pull-request heads are not supported.');
              return;
            }

            const transfer = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${transferBranch}`,
            });
            const expectedTransferSha = transfer.data.object.sha;
            if (
              transfer.data.object.type !== 'commit' ||
              !/^[0-9a-f]{40}$/.test(expectedTransferSha)
            ) {
              core.setFailed('Transfer branch must resolve to a commit SHA.');
              return;
            }

            core.setOutput('transfer_branch', transferBranch);
            core.setOutput('expected_transfer_sha', expectedTransferSha);
            core.setOutput('expected_manifest_sha256', expectedManifestSha256);
            core.setOutput('expected_target_branch', pull.data.head.ref);
            core.setOutput('issue_number', String(context.issue.number));
            core.setOutput('comment_id', String(context.payload.comment.id));

  prepare:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      transfer_branch: ${{ steps.prepare.outputs.transfer_branch }}
      expected_base_sha: ${{ steps.prepare.outputs.expected_base_sha }}
      expected_result_tree_sha: ${{ steps.prepare.outputs.expected_result_tree_sha }}
      candidate_commit_sha: ${{ steps.prepare.outputs.candidate_commit_sha }}
    env:
      TRANSFER_BRANCH: ${{ needs.request.outputs.transfer_branch }}
      EXPECTED_TRANSFER_SHA: ${{ needs.request.outputs.expected_transfer_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.request.outputs.expected_manifest_sha256 }}
      EXPECTED_TARGET_BRANCH: ${{ needs.request.outputs.expected_target_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Preserve trusted publication tool
        run: install -m 0755 tools/local-agent/patch-publication.py "$RUNNER_TEMP/patch-publication.py"

      - name: Read exact transfer payload
        run: |
          git fetch --no-tags origin \
            "refs/heads/$TRANSFER_BRANCH:refs/remotes/origin/patch-transfer"
          actual_transfer_sha="$(git rev-parse refs/remotes/origin/patch-transfer)"
          if [[ "$actual_transfer_sha" != "$EXPECTED_TRANSFER_SHA" ]]; then
            echo "Transfer branch moved: expected $EXPECTED_TRANSFER_SHA, found $actual_transfer_sha" >&2
            exit 1
          fi
          git show \
            "refs/remotes/origin/patch-transfer:.agent-patch-publication/manifest.json" \
            > "$RUNNER_TEMP/manifest.json"
          git show \
            "refs/remotes/origin/patch-transfer:.agent-patch-publication/change.patch" \
            > "$RUNNER_TEMP/change.patch"

      - name: Verify authorized manifest digest
        run: |
          actual_manifest_sha256="$(sha256sum "$RUNNER_TEMP/manifest.json" | awk '{print $1}')"
          if [[ "$actual_manifest_sha256" != "$EXPECTED_MANIFEST_SHA256" ]]; then
            echo "Manifest SHA-256 mismatch: expected $EXPECTED_MANIFEST_SHA256, found $actual_manifest_sha256" >&2
            exit 1
          fi

      - name: Inspect request
        id: inspect
        run: |
          args=(
            inspect-request
            --repository "$GITHUB_WORKSPACE"
            --manifest "$RUNNER_TEMP/manifest.json"
            --patch "$RUNNER_TEMP/change.patch"
            --transfer-branch "$TRANSFER_BRANCH"
            --expected-target-branch "$EXPECTED_TARGET_BRANCH"
            --default-branch "$DEFAULT_BRANCH"
            --github-output "$GITHUB_OUTPUT"
          )
          python3 -B "$RUNNER_TEMP/patch-publication.py" "${args[@]}"

      - name: Check out exact target base
        env:
          TARGET_BRANCH: ${{ steps.inspect.outputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ steps.inspect.outputs.expected_base_sha }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/patch-target"
          actual_base_sha="$(git rev-parse refs/remotes/origin/patch-target)"
          if [[ "$actual_base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Target branch moved: expected $EXPECTED_BASE_SHA, found $actual_base_sha" >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED_BASE_SHA"

      - name: Prepare exact candidate bundle
        id: prepare
        run: |
          args=(
            prepare
            --repository "$GITHUB_WORKSPACE"
            --manifest "$RUNNER_TEMP/manifest.json"
            --patch "$RUNNER_TEMP/change.patch"
            --transfer-branch "$TRANSFER_BRANCH"
            --expected-target-branch "$EXPECTED_TARGET_BRANCH"
            --default-branch "$DEFAULT_BRANCH"
            --output-directory "$RUNNER_TEMP/publication"
            --github-output "$GITHUB_OUTPUT"
          )
          python3 -B "$RUNNER_TEMP/patch-publication.py" "${args[@]}"

      - name: Name candidate artifact
        id: names
        run: echo "artifact_name=patch-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Download prepared candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication

      - name: Check out exact candidate
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          CANDIDATE_COMMIT_SHA: ${{ needs.prepare.outputs.candidate_commit_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.expected_base_sha }}
          EXPECTED_RESULT_TREE_SHA: ${{ needs.prepare.outputs.expected_result_tree_sha }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/patch-target"
          test "$(git rev-parse refs/remotes/origin/patch-target)" = "$EXPECTED_BASE_SHA"
          git fetch --no-tags "$RUNNER_TEMP/publication/publication.bundle" \
            "refs/heads/patch-publication-candidate:refs/heads/test-candidate"
          git checkout --detach refs/heads/test-candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_RESULT_TREE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate repository tooling
        run: |
          bash -n tools/work-packages/integrate.sh
          jq empty tools/work-packages/PACKAGE.schema.json
          jq empty tools/work-packages/templates/PACKAGE.example.json
          while IFS= read -r test_file; do
            case "$test_file" in
              *.py) python3 -B "$test_file" ;;
              *.sh) bash "$test_file" ;;
            esac
          done < <(find tools/local-agent -maxdepth 1 -type f \
            \( -name 'test-*.py' -o -name 'test-*.sh' \) -print | sort)

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published_commit_sha: ${{ steps.verify.outputs.candidate_commit_sha }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Preserve trusted publication tool
        run: install -m 0755 tools/local-agent/patch-publication.py "$RUNNER_TEMP/patch-publication.py"

      - name: Download tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication

      - name: Fetch expected target base
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.expected_base_sha }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/patch-target"
          actual_base_sha="$(git rev-parse refs/remotes/origin/patch-target)"
          if [[ "$actual_base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Target branch moved: expected $EXPECTED_BASE_SHA, found $actual_base_sha" >&2
            exit 1
          fi

      - name: Verify candidate without executing it
        id: verify
        run: |
          python3 -B "$RUNNER_TEMP/patch-publication.py" verify-bundle \
            --repository "$GITHUB_WORKSPACE" \
            --metadata "$RUNNER_TEMP/publication/publication.json" \
            --bundle "$RUNNER_TEMP/publication/publication.bundle" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish by non-force fast-forward
        env:
          TARGET_BRANCH: ${{ steps.verify.outputs.target_branch }}
          CANDIDATE_COMMIT_SHA: ${{ steps.verify.outputs.candidate_commit_sha }}
        run: |
          git push --porcelain origin \
            "$CANDIDATE_COMMIT_SHA:refs/heads/$TARGET_BRANCH"

  cleanup-transfer:
    if: ${{ always() && needs.request.result == 'success' }}
    needs: [request, prepare, test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cleanup_status: ${{ steps.cleanup_transfer.outputs.cleanup_status }}
    steps:
      - name: Delete exact transfer ref
        id: cleanup_transfer
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_BRANCH: ${{ needs.request.outputs.transfer_branch }}
          EXPECTED_TRANSFER_SHA: ${{ needs.request.outputs.expected_transfer_sha }}
        run: |
          set -euo pipefail
          [[ "$TRANSFER_BRANCH" =~ ^agent-patch-publication/[A-Za-z0-9][A-Za-z0-9._/-]{0,215}$ ]]
          [[ "$TRANSFER_BRANCH" != *".."* ]]
          [[ "$TRANSFER_BRANCH" != *"//"* ]]
          [[ "$TRANSFER_BRANCH" != */ ]]
          [[ "$EXPECTED_TRANSFER_SHA" =~ ^[0-9a-f]{40}$ ]]

          cleanup_repo="$RUNNER_TEMP/patch-publication-cleanup"
          git init -q "$cleanup_repo"
          cd "$cleanup_repo"
          remote_url="https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          transfer_ref="refs/heads/$TRANSFER_BRANCH"
          cleanup_status=failed
          cleanup_failed=0

          set +e
          push_output="$(git -c "http.https://github.com/.extraheader=$auth_header" \
            push --porcelain \
            --force-with-lease="${transfer_ref}:${EXPECTED_TRANSFER_SHA}" \
            "$remote_url" ":${transfer_ref}" 2>&1)"
          push_result=$?
          set -e

          if [[ $push_result -eq 0 ]]; then
            cleanup_status=removed
          else
            set +e
            remote_output="$(git -c "http.https://github.com/.extraheader=$auth_header" \
              ls-remote --heads "$remote_url" "$transfer_ref" 2>&1)"
            remote_result=$?
            set -e
            if [[ $remote_result -ne 0 ]]; then
              echo "$push_output" >&2
              echo "$remote_output" >&2
              cleanup_status=failed
              cleanup_failed=1
            elif [[ -z "$remote_output" ]]; then
              cleanup_status=already_absent
            else
              current_transfer_sha="${remote_output%%$'\t'*}"
              if [[ "$current_transfer_sha" != "$EXPECTED_TRANSFER_SHA" ]]; then
                cleanup_status=preserved_changed
              else
                echo "$push_output" >&2
                cleanup_status=failed
                cleanup_failed=1
              fi
            fi
          fi

          echo "cleanup_status=$cleanup_status" >> "$GITHUB_OUTPUT"
          if [[ $cleanup_failed -ne 0 ]]; then
            exit 1
          fi

  cleanup-comment:
    if: ${{ always() && needs.request.result == 'success' }}
    needs: [request, prepare, test, publish, cleanup-transfer]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record publication result
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch || needs.request.outputs.expected_target_branch }}
          PUBLISHED_COMMIT_SHA: ${{ needs.publish.outputs.published_commit_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CLEANUP_STATUS: ${{ needs.cleanup-transfer.outputs.cleanup_status }}
        run: |
          {
            printf '## Patch publication result\n\n'
            printf -- '- target branch: `%s`\n' "$TARGET_BRANCH"
            printf -- '- published commit: `%s`\n' "${PUBLISHED_COMMIT_SHA:-none}"
            printf -- '- prepare: `%s`\n' "$PREPARE_RESULT"
            printf -- '- test: `%s`\n' "$TEST_RESULT"
            printf -- '- publish: `%s`\n' "$PUBLISH_RESULT"
            printf -- '- transfer cleanup: `%s`\n' "${CLEANUP_STATUS:-failed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete exact accepted publication command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_ID: ${{ needs.request.outputs.comment_id }}
          ISSUE_NUMBER: ${{ needs.request.outputs.issue_number }}
          TRANSFER_BRANCH: ${{ needs.request.outputs.transfer_branch }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.request.outputs.expected_manifest_sha256 }}
        with:
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(commentId) || !Number.isSafeInteger(issueNumber)) {
              core.setFailed('Validated publication comment identity is missing.');
              return;
            }

            const expectedCommand = `/publish-patch ${process.env.TRANSFER_BRANCH} ${process.env.EXPECTED_MANIFEST_SHA256}`;
            let comment;
            try {
              comment = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
              });
            } catch (error) {
              if (error.status === 404) {
                core.notice('Publication command comment was already absent.');
                return;
              }
              throw error;
            }

            const expectedIssueUrl = `${context.apiUrl}/repos/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}`;
            if (
              comment.data.issue_url !== expectedIssueUrl ||
              comment.data.body.trim() !== expectedCommand
            ) {
              core.warning('Publication command comment changed after validation and was preserved.');
              return;
            }

            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
            });
