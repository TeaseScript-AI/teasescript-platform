name: Phase 1 deleted artifact proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-delete-test-artifact.yml

permissions: {}

jobs:
  delete-fixture:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - name: Delete the fixed Phase 1 fixture artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const artifactId = 8908406686;
            const sourceSha = '251dbc07c7dde066de5714d973a381d505cb0186';
            const expectedName = `teasescript-source-${sourceSha}`;
            const response = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });
            const artifact = response.data;
            if (
              artifact.id !== artifactId ||
              artifact.name !== expectedName ||
              artifact.expired === true
            ) {
              throw new Error('Refusing to delete anything except the exact live Phase 1 fixture artifact.');
            }

            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sourceSha,
              state: 'success',
              context: 'source-bundle/deleted-artifact-proof-v1',
              description: `Deleted test artifact ${artifactId}.`,
              target_url: runUrl,
            });

            const temporaryBranches = [
              'agent/issue-234-deleted-artifact-proof',
              'agent/issue-234-deleted-artifact-proof-receiver',
              'agent/issue-234-deleted-artifact-proof-target',
              'agent/issue-234-deleted-artifact-proof-pr',
              'agent/issue-234-deleted-artifact-proof-final',
              'agent/issue-234-deleted-artifact-proof-current',
              'agent/issue-234-deleted-artifact-proof-use-this',
              'agent/issue-234-deleted-artifact-proof-actual',
              'agent/issue-234-deleted-artifact-proof-final',
              'agent-patch-publication/issue-234-deleted-artifact-proof',
              'agent-patch-publication/issue-234-deleted-artifact-proof-v2',
            ];
            for (const branch of [...new Set(temporaryBranches)]) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (![404, 422].includes(error?.status)) throw error;
              }
            }
