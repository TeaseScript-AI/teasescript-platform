name: Apply final PR 117 repair

on:
  push:
    branches:
      - feat/issue-110-foreground-interaction-runtime
    paths:
      - .github/pr117-final-repair.patch.gz.b64
      - .github/workflows/pr117-apply-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-110-foreground-interaction-runtime
          fetch-depth: 0

      - name: Set up exact Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply final repair patch
        run: |
          base64 --decode .github/pr117-final-repair.patch.gz.b64 | gzip --decompress > /tmp/pr117-final.patch
          git apply --check /tmp/pr117-final.patch
          git apply /tmp/pr117-final.patch

      - name: Install dependencies
        run: npm ci

      - name: Verify repaired branch
        run: |
          find dist -depth -delete 2>/dev/null || true
          npm run check
          npm run build
          git diff --check

      - name: Commit verified repair
        run: |
          rm -f .github/pr117-final-repair.patch.gz.b64
          rm -f .github/pr117-second-repair.part-*.b64
          rm -f .github/workflows/pr117-apply-final-repair.yml
          git config user.name "TeaseScript repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix interaction result lifecycle invariants"
          git push origin HEAD:feat/issue-110-foreground-interaction-runtime
