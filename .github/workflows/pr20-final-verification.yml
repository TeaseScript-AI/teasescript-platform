name: PR20 final verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve functional probe
        run: cp .github/pr20-final-verification.mjs /tmp/pr20-final-verification.mjs

      - name: Check out PR20 head
        uses: actions/checkout@v4
        with:
          ref: bfa2a6d4e2c45ac9fb6b5be0d924625d680f5879
          fetch-depth: 0

      - name: Confirm current main and branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "ed098995238172065c6dcd1ea2b8e9e0d4238675"
          test "$(git rev-parse HEAD)" = "bfa2a6d4e2c45ac9fb6b5be0d924625d680f5879"

      - name: Provision exact .nvmrc Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install nvm
        shell: bash
        run: |
          set -eo pipefail
          export NVM_DIR="$RUNNER_TEMP/nvm"
          rm -rf "$NVM_DIR"
          git clone --depth 1 --branch v0.40.3 https://github.com/nvm-sh/nvm.git "$NVM_DIR"
          test -s "$NVM_DIR/nvm.sh"

      - name: Run nvm use
        shell: bash
        run: |
          set -eo pipefail
          export NVM_DIR="$RUNNER_TEMP/nvm"
          SETUP_NODE_VERSION="$(node --version)"
          SETUP_NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          mkdir -p "$NVM_DIR/versions/node"
          ln -s "$SETUP_NODE_ROOT" "$NVM_DIR/versions/node/$SETUP_NODE_VERSION"
          . "$NVM_DIR/nvm.sh"
          nvm use
          test "$(node --version)" = "$SETUP_NODE_VERSION"
          echo "$NVM_DIR/versions/node/$SETUP_NODE_VERSION/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run complete check
        shell: bash
        run: |
          set -eo pipefail
          npm run check | tee "$RUNNER_TEMP/npm-check.log"

      - name: Run build
        run: npm run build

      - name: Run focused compiled tests
        shell: bash
        run: |
          set -eo pipefail
          node --test \
            dist/tests/runtime-random.test.js \
            dist/tests/runtime-checkpoint.test.js \
            dist/tests/control-flow-runtime.test.js \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Run functional verification
        run: node /tmp/pr20-final-verification.mjs

      - name: Verify PR scope, diff, and worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            src/runtime/random.ts \
            src/runtime/state.ts \
            tests/runtime-random.test.ts | sort)"
          test "$actual" = "$expected"
          git status --short
          test -z "$(git status --short)"

      - name: Write verification summary
        shell: bash
        run: |
          set -euo pipefail
          extract_metric() {
            node --input-type=module - "$1" "$2" <<'NODE'
          import fs from "node:fs";
          const [file, metric] = process.argv.slice(2);
          const text = fs.readFileSync(file, "utf8").replace(/\u001b\[[0-9;]*m/g, "");
          const pattern = new RegExp(`\\b${metric}\\s+(\\d+)`, "g");
          const matches = [...text.matchAll(pattern)];
          if (matches.length === 0) {
            console.error(`Unable to find ${metric} in ${file}`);
            console.error(text.slice(-3000));
            process.exit(1);
          }
          console.log(matches.at(-1)[1]);
          NODE
          }
          FULL_TESTS="$(extract_metric "$RUNNER_TEMP/npm-check.log" tests)"
          FULL_PASS="$(extract_metric "$RUNNER_TEMP/npm-check.log" pass)"
          FULL_FAIL="$(extract_metric "$RUNNER_TEMP/npm-check.log" fail)"
          FOCUSED_TESTS="$(extract_metric "$RUNNER_TEMP/focused-tests.log" tests)"
          FOCUSED_PASS="$(extract_metric "$RUNNER_TEMP/focused-tests.log" pass)"
          FOCUSED_FAIL="$(extract_metric "$RUNNER_TEMP/focused-tests.log" fail)"
          cat > "$RUNNER_TEMP/pr20-final-summary.txt" <<EOF
          RESULT=PASS
          MAIN_SHA=ed098995238172065c6dcd1ea2b8e9e0d4238675
          HEAD_SHA=bfa2a6d4e2c45ac9fb6b5be0d924625d680f5879
          NODE=$(node --version)
          NPM=$(npm --version)
          NVM_USE=PASS
          NPM_CI=PASS
          FULL_TESTS=$FULL_TESTS
          FULL_PASS=$FULL_PASS
          FULL_FAIL=$FULL_FAIL
          NPM_CHECK=PASS
          NPM_BUILD=PASS
          FOCUSED_TESTS=$FOCUSED_TESTS
          FOCUSED_PASS=$FOCUSED_PASS
          FOCUSED_FAIL=$FOCUSED_FAIL
          FUNCTIONAL_PROBES=PASS
          DIFF_CHECK=PASS
          STATUS_CLEAN=PASS
          SCOPE=src/runtime/random.ts,src/runtime/state.ts,tests/runtime-random.test.ts
          EOF
          cat "$RUNNER_TEMP/pr20-final-summary.txt"

      - name: Upload verification summary
        uses: actions/upload-artifact@v4
        with:
          name: pr20-final-summary
          path: ${{ runner.temp }}/pr20-final-summary.txt
