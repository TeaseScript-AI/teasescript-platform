name: PR30 final verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.result.outputs.node }}
      tests: ${{ steps.result.outputs.tests }}
      pass: ${{ steps.result.outputs.pass }}
      fail: ${{ steps.result.outputs.fail }}
      build: ${{ steps.result.outputs.build }}
      diff: ${{ steps.result.outputs.diff }}
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR 30 head
        id: result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/issue-28-runtime-api-docs
          git checkout --detach origin/agent/issue-28-runtime-api-docs
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install
          nvm use
          npm ci
          npm run check > /tmp/pr30-check.log
          tests="$(grep -E '(^| )tests [0-9]+$' /tmp/pr30-check.log | tail -n 1 | grep -oE '[0-9]+$')"
          passed="$(grep -E '(^| )pass [0-9]+$' /tmp/pr30-check.log | tail -n 1 | grep -oE '[0-9]+$')"
          failed="$(grep -E '(^| )fail [0-9]+$' /tmp/pr30-check.log | tail -n 1 | grep -oE '[0-9]+$')"
          test -n "$tests"
          npm run build
          git diff --check origin/main...HEAD
          status="$(git status --short)"
          test -z "$status"
          {
            echo "node=$(node --version)"
            echo "tests=$tests"
            echo "pass=$passed"
            echo "fail=$failed"
            echo "build=passed"
            echo "diff=passed"
            echo "status=clean"
          } >> "$GITHUB_OUTPUT"

  report:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "node=${{ needs.verify.outputs.node }}"
          echo "tests=${{ needs.verify.outputs.tests }}"
          echo "pass=${{ needs.verify.outputs.pass }}"
          echo "fail=${{ needs.verify.outputs.fail }}"
          echo "build=${{ needs.verify.outputs.build }}"
          echo "git diff --check origin/main...HEAD=${{ needs.verify.outputs.diff }}"
          echo "git status --short=${{ needs.verify.outputs.status }}"
