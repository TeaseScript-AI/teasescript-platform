name: Agent 4 final conflict verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-40-41-runtime-snapshot-invariants
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run exact verification
        run: |
          set -o pipefail
          mkdir -p /tmp/agent4-evidence
          node --version | tee /tmp/agent4-evidence/node-version.txt
          npm --version | tee /tmp/agent4-evidence/npm-version.txt
          cat .nvmrc | tee /tmp/agent4-evidence/nvmrc.txt
          npm ci 2>&1 | tee /tmp/agent4-evidence/npm-ci.txt
          npm run check 2>&1 | tee /tmp/agent4-evidence/full-check.txt
          npm run build 2>&1 | tee /tmp/agent4-evidence/build.txt
          node --test dist/tests/runtime-snapshot-invariants.test.js 2>&1 | tee /tmp/agent4-evidence/focused.txt
          git diff --check origin/main...HEAD 2>&1 | tee /tmp/agent4-evidence/diff-check.txt
          git status --short | tee /tmp/agent4-evidence/status.txt
          test -z "$(git status --short)"
          git rev-parse origin/main | tee /tmp/agent4-evidence/main-sha.txt
          git rev-parse HEAD | tee /tmp/agent4-evidence/head-sha.txt
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent4-post-conflict-verification
          path: /tmp/agent4-evidence
          retention-days: 1
