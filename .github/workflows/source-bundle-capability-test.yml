name: Source Bundle Capability Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create and verify exact Git source bundle
        shell: bash
        run: |
          set -euo pipefail

          head_sha='${{ github.event.pull_request.head.sha }}'
          head_ref='${{ github.head_ref }}'
          tree_sha="$(git rev-parse "${head_sha}^{tree}")"

          # Include both HEAD and a refs/heads/* ref so an ordinary clone
          # checks out the exact pull-request head automatically.
          git update-ref refs/heads/source-bundle "${head_sha}"
          git bundle create repository.bundle HEAD refs/heads/source-bundle

          verify_repo="$(mktemp -d)"
          git -C "${verify_repo}" init --bare --quiet
          git -C "${verify_repo}" bundle verify "${GITHUB_WORKSPACE}/repository.bundle"

          clone_dir="$(mktemp -d)"
          rmdir "${clone_dir}"
          git clone --quiet repository.bundle "${clone_dir}"
          test "$(git -C "${clone_dir}" rev-parse HEAD)" = "${head_sha}"
          test "$(git -C "${clone_dir}" rev-parse 'HEAD^{tree}')" = "${tree_sha}"
          test -z "$(git -C "${clone_dir}" status --short)"

          bundle_sha256="$(sha256sum repository.bundle | awk '{print $1}')"

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commitSha "${head_sha}" \
            --arg treeSha "${tree_sha}" \
            --arg branch "${head_ref}" \
            --arg bundleRef "refs/heads/source-bundle" \
            --arg bundleSha256 "${bundle_sha256}" \
            '{
              repository: $repository,
              commitSha: $commitSha,
              treeSha: $treeSha,
              branch: $branch,
              bundleRef: $bundleRef,
              bundleSha256: $bundleSha256
            }' > manifest.json

          test "$(jq -r '.commitSha' manifest.json)" = "${head_sha}"
          test "$(jq -r '.treeSha' manifest.json)" = "${tree_sha}"
          echo "${bundle_sha256}  repository.bundle" | sha256sum --check --strict

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: teasescript-source-${{ github.event.pull_request.head.sha }}
          path: |
            repository.bundle
            manifest.json
          if-no-files-found: error
          retention-days: 1
