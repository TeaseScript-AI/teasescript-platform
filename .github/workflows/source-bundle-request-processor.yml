name: Process source bundle request
run-name: Process ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [Source bundle request]
    types: [completed]

permissions: {}

jobs:
  bundle:
    if: >-
      github.event.workflow_run.event == 'create' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'source-bundle-request/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      request_branch: ${{ steps.request.outputs.request_branch }}
      request_sha: ${{ steps.request.outputs.request_sha }}
      status_context: ${{ steps.request.outputs.status_context }}
      request_validated: ${{ steps.request.outputs.validated }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      TOOLING_REF: ${{ github.workflow_sha }}
    steps:
      - name: Validate exact request against current default branch
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const branch = workflowRun.head_branch;
            const requestSha = workflowRun.head_sha;
            const match = /^source-bundle-request\/([0-9a-f]{40})\/([a-z0-9][a-z0-9-]{0,31})$/.exec(branch);
            if (!match) {
              core.setFailed('Invalid source-bundle request branch.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(requestSha)) {
              core.setFailed('Request branch must resolve to a full lowercase commit SHA.');
              return;
            }

            const sourceSha = match[1];
            const nonce = match[2];
            const request = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            if (
              request.data.object.type !== 'commit' ||
              request.data.object.sha !== requestSha
            ) {
              core.setFailed('Request branch moved after its create event.');
              return;
            }

            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repository.data.default_branch;
            const currentDefault = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            });
            if (currentDefault.data.object.type !== 'commit') {
              core.setFailed('Default branch did not resolve to a commit.');
              return;
            }
            const currentDefaultSha = currentDefault.data.object.sha;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${requestSha}...${currentDefaultSha}`,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed('Request branch must be created from the current default branch or an unchanged ancestor of it.');
              return;
            }

            const source = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sourceSha,
            });
            if (source.data.sha !== sourceSha) {
              core.setFailed('Requested source SHA did not resolve exactly.');
              return;
            }

            core.setOutput('source_sha', sourceSha);
            core.setOutput('request_branch', branch);
            core.setOutput('request_sha', requestSha);
            core.setOutput('status_context', `source-bundle/request/${nonce}`);
            core.setOutput('validated', 'true');

      - name: Check out trusted bundle tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
          show-progress: false

      - name: Check out requested source as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact requested source
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: test "$(git rev-parse --verify HEAD)" = "$SOURCE_SHA"

      - name: Create verified source bundle
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          cd source
          bash ../tooling/tools/local-agent/create-source-bundle.sh \
            --output ../source-artifact \
            --repository "${{ github.repository }}" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_SHA" \
            --event-name source-bundle-request

      - name: Upload source artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teasescript-source-${{ steps.request.outputs.source_sha }}
          path: source-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-result:
    if: ${{ always() && needs.bundle.outputs.request_validated == 'true' }}
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Publish connector-readable result status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ needs.bundle.outputs.source_sha }}
          STATUS_CONTEXT: ${{ needs.bundle.outputs.status_context }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_URL: ${{ needs.bundle.outputs.artifact_url }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
        with:
          script: |
            const artifactIdText = process.env.ARTIFACT_ID || '';
            const artifactUrl = process.env.ARTIFACT_URL || '';
            const artifactDigest = process.env.ARTIFACT_DIGEST || '';
            const sourceSha = process.env.SOURCE_SHA || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let validationError = null;

            if (
              process.env.BUNDLE_RESULT !== 'success' ||
              !/^[1-9][0-9]*$/.test(artifactIdText) ||
              !/^[0-9a-f]{64}$/.test(artifactDigest) ||
              !/^[0-9a-f]{40}$/.test(sourceSha)
            ) {
              validationError = 'Source-bundle production did not return complete artifact metadata.';
            }

            const artifactId = Number.parseInt(artifactIdText, 10);
            const expectedArtifactUrl = `${runUrl}/artifacts/${artifactIdText}`;
            if (!validationError && (!Number.isSafeInteger(artifactId) || artifactUrl !== expectedArtifactUrl)) {
              validationError = 'The upload result did not contain the exact expected artifact URL.';
            }

            if (!validationError) {
              try {
                const artifactResponse = await github.rest.actions.getArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifactId,
                });
                const artifact = artifactResponse.data;
                const expiresAtMs = Date.parse(artifact.expires_at || '');
                const producerResponse = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                });
                const producer = producerResponse.data;
                if (
                  artifact.id !== artifactId ||
                  artifact.name !== `teasescript-source-${sourceSha}` ||
                  artifact.expired === true ||
                  artifact.digest !== `sha256:${artifactDigest}` ||
                  artifact.workflow_run?.id !== context.runId ||
                  !Number.isFinite(expiresAtMs) ||
                  expiresAtMs <= Date.now() ||
                  producer.id !== context.runId ||
                  producer.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  producer.path !== '.github/workflows/source-bundle-request-processor.yml' ||
                  !['queued', 'in_progress'].includes(producer.status)
                ) {
                  validationError = 'Uploaded Source-bundle metadata did not match the trusted producer result.';
                }
              } catch (error) {
                validationError = `Source-bundle metadata verification failed: ${error.message}`;
              }
            }

            const succeeded = validationError === null;
            const description = succeeded
              ? `artifact ${artifactIdText} sha256:${artifactDigest}`
              : `source bundle failed; run ${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sourceSha,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description,
              target_url: succeeded ? artifactUrl : runUrl,
            });

            if (!succeeded) {
              core.setFailed(validationError);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sourceSha,
              state: 'success',
              context: 'source-bundle/artifact-v1',
              description,
              target_url: artifactUrl,
            });

  cleanup-request:
    if: >-
      always() &&
      needs.bundle.outputs.request_validated == 'true' &&
      needs.publish-result.result == 'success'
    needs: [bundle, publish-result]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Delete only the unchanged exact request ref
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BRANCH: ${{ needs.bundle.outputs.request_branch }}
          EXPECTED_REQUEST_SHA: ${{ needs.bundle.outputs.request_sha }}
          SOURCE_SHA: ${{ needs.bundle.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_BRANCH" =~ ^source-bundle-request/([0-9a-f]{40})/[a-z0-9][a-z0-9-]{0,31}$ ]]
          [[ "${BASH_REMATCH[1]}" = "$SOURCE_SHA" ]]
          [[ "$EXPECTED_REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]

          cleanup_repo="$RUNNER_TEMP/source-bundle-request-cleanup"
          git init -q "$cleanup_repo"
          cd "$cleanup_repo"
          remote_url="https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          request_ref="refs/heads/$REQUEST_BRANCH"
          remote_output="$(git -c "http.https://github.com/.extraheader=$auth_header" \
            ls-remote --heads "$remote_url" "$request_ref")"
          if [[ -z "$remote_output" ]]; then
            echo 'Request ref was already absent.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          current_request_sha="${remote_output%%$'\t'*}"
          if [[ "$current_request_sha" != "$EXPECTED_REQUEST_SHA" ]]; then
            echo 'Request ref changed after validation and was preserved.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git -c "http.https://github.com/.extraheader=$auth_header" \
            push --porcelain \
            --force-with-lease="${request_ref}:${EXPECTED_REQUEST_SHA}" \
            "$remote_url" ":${request_ref}"
          echo 'The exact unchanged request ref was removed.' >> "$GITHUB_STEP_SUMMARY"
