name: Source bundle request
run-name: Source bundle request ${{ github.event.ref }}

on:
  create:

permissions: {}

jobs:
  gate:
    if: >-
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'source-bundle-request/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate request branch shape
        env:
          REQUEST_BRANCH: ${{ github.event.ref }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_BRANCH" =~ ^source-bundle-request/[0-9a-f]{40}/[a-z0-9][a-z0-9-]{0,31}$ ]]
          [[ "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'accepted source-bundle request %s at %s\n' \
            "$REQUEST_BRANCH" "$REQUEST_SHA"
