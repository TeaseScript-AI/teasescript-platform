name: Source bundle
# Temporary issue #207 workflow-file publication proof. Do not merge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-bundle:
    runs-on: ubuntu-latest
    env:
      TOOLING_REF: ${{ github.workflow_sha }}
      REQUESTED_SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Check out trusted bundle tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
          show-progress: false

      - name: Check out selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REQUESTED_SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source commit
        id: source
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse --verify HEAD)
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create verified source bundle
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          cd source
          bash ../tooling/tools/local-agent/create-source-bundle.sh \
            --output ../source-artifact \
            --repository "${{ github.repository }}" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --event-name "${{ github.event_name }}"

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teasescript-source-${{ steps.source.outputs.sha }}
          path: source-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
